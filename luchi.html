<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Luciana aprende a leer 🦉</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F0F7FF;
  --bg-pattern: #E1EFFF;
  --ink: #1C2A4A;
  --card: #FFFFFF;
  --card-border: #D7E7F7;
  --vow: #FF3B5C;      /* Vocales en rojo/rosa cálido */
  --con: #2374E1;      /* Consonantes en azul */
  --ok: #10B981;
  --star: #FFB300;
  --soft: #DDEBFA;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  background-image: radial-gradient(var(--bg-pattern) 20%, transparent 20%);
  background-size: 24px 24px;
  color: var(--ink);
  font-family: "Baloo 2", "Comic Sans MS", "Trebuchet MS", cursive, sans-serif;
  font-weight: 700;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  user-select: none;
}

.app {
  width: 100%;
  max-width: 650px;
  padding: 12px 14px 24px;
  display: flex;
  flex-direction: column;
}

/* Encabezado */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
  gap: 8px;
}
.title-group {
  display: flex;
  align-items: center;
  gap: 8px;
}
.title-group h1 {
  font-size: clamp(22px, 5.5vw, 30px);
  margin: 0;
  font-weight: 800;
  color: #1A365D;
  line-height: 1.1;
}
.header-badges {
  display: flex;
  align-items: center;
  gap: 8px;
}
.stars, .stickers-btn {
  background: var(--card);
  border: 3px solid #FFE082;
  border-bottom: 5px solid #FFCA28;
  border-radius: 999px;
  padding: 4px 14px;
  font-size: clamp(16px, 4.5vw, 20px);
  font-weight: 800;
  color: #B45309;
  white-space: nowrap;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 4px;
  transition: transform .1s;
}
.stickers-btn {
  border-color: #E9D5FF;
  border-bottom-color: #C084FC;
  color: #6B21A8;
}
.stars:active, .stickers-btn:active {
  transform: translateY(2px);
}

/* Navegación por pestañas */
nav {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  margin: 10px 0 14px;
}
nav button {
  font: inherit;
  font-weight: 800;
  font-size: clamp(13px, 3.4vw, 16px);
  border: 2px solid var(--card-border);
  border-bottom: 5px solid var(--card-border);
  background: var(--card);
  color: #475569;
  border-radius: 18px;
  padding: 8px 4px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  transition: all .15s ease;
}
nav button span.icon { font-size: clamp(20px, 5.5vw, 26px); }
nav button[aria-selected="true"] {
  border-color: #2563EB;
  border-bottom-color: #1D4ED8;
  background: #2563EB;
  color: #FFFFFF;
  transform: translateY(2px);
}

/* Guía Lula la lechuza */
.guide {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}
.owl-wrap {
  position: relative;
  flex-shrink: 0;
}
.owl {
  font-size: clamp(48px, 13vw, 62px);
  line-height: 1;
  border: 0;
  background: none;
  cursor: pointer;
  padding: 0;
  display: block;
  transition: transform .2s cubic-bezier(.34,1.56,.64,1);
}
.owl:active { transform: scale(1.15) rotate(-5deg); }
.bub {
  flex: 1;
  background: var(--card);
  border: 2px solid #E2E8F0;
  border-left: 6px solid #F59E0B;
  border-radius: 20px;
  padding: 10px 16px;
  font-size: clamp(16px, 4.3vw, 20px);
  font-weight: 700;
  min-height: 56px;
  display: flex;
  align-items: center;
  box-shadow: 0 4px 12px rgba(30, 41, 59, 0.05);
  line-height: 1.25;
}

/* Panel Principal de Juego */
.panel {
  background: var(--card);
  border: 3px solid var(--card-border);
  border-bottom: 8px solid var(--card-border);
  border-radius: 28px;
  padding: 16px 12px 22px;
  text-align: center;
  position: relative;
  min-height: 340px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  box-shadow: 0 8px 24px rgba(37, 99, 235, 0.06);
}

/* Indicador pedagógico para pasar el mouse */
.hover-tip {
  font-size: clamp(13px, 3.6vw, 15px);
  color: #475569;
  background: #EFF6FF;
  border: 1.5px dashed #93C5FD;
  border-radius: 999px;
  padding: 4px 14px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 6px;
  animation: pulseTip 2s infinite ease-in-out;
}
@keyframes pulseTip {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.03); }
}

/* Imagen grande */
.big-pic {
  font-size: clamp(75px, 22vw, 115px);
  line-height: 1.1;
  margin: 2px 0 8px;
  filter: drop-shadow(0 6px 8px rgba(0,0,0,0.08));
  animation: popIn .3s ease-out;
}
@keyframes popIn {
  from { transform: scale(0.6); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

/* Contenedor interactivo de la palabra con lectura por sílabas */
.word-interactive-container {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 8px 16px;
  margin: 4px 0 12px;
  border-radius: 24px;
  background: #F8FAFC;
  border: 3px solid #E2E8F0;
  border-bottom: 6px solid #CBD5E1;
  cursor: pointer;
  transition: all .2s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.word-interactive-container:hover {
  background: #FFFBEB;
  border-color: #FCD34D;
  border-bottom-color: #F59E0B;
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(245, 158, 11, 0.15);
}

/* Trozos de sílabas interactivos */
.syllable-chunk {
  font-size: clamp(42px, 13vw, 70px);
  font-weight: 800;
  letter-spacing: .06em;
  padding: 2px 10px;
  border-radius: 16px;
  transition: all .2s cubic-bezier(0.34, 1.56, 0.64, 1);
  display: inline-block;
  border: 3px solid transparent;
}
.syllable-chunk:hover,
.syllable-chunk.highlighted {
  background: #FEF08A;
  border-color: #F59E0B;
  color: #1E293B !important;
  transform: translateY(-6px) scale(1.15);
  box-shadow: 0 8px 18px rgba(245, 158, 11, 0.4);
}
.word-interactive-container.complete-highlight {
  background: #DCFCE7 !important;
  border-color: #86EFAC !important;
  border-bottom-color: #22C55E !important;
  transform: scale(1.06);
  box-shadow: 0 10px 24px rgba(34, 197, 94, 0.25);
}

.v { color: var(--vow); }
.c { color: var(--con); }

/* Botones de acción / audio de ayuda */
.helper-row {
  display: flex;
  gap: 8px;
  margin: 4px 0 14px;
  justify-content: center;
  flex-wrap: wrap;
}
.btn-sound {
  font: inherit;
  font-size: clamp(15px, 4vw, 18px);
  font-weight: 800;
  border: 2px solid #FCD34D;
  border-bottom: 4px solid #F59E0B;
  background: #FEF3C7;
  color: #92400E;
  border-radius: 999px;
  padding: 6px 18px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: transform .1s;
}
.btn-sound:active { transform: translateY(2px); }

/* Cuadrículas y opciones */
.options-grid {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 12px;
  width: 100%;
  max-width: 520px;
  margin-top: 8px;
}

/* Fichas y botones táctiles gigantes */
.tile-btn {
  font: inherit;
  font-weight: 800;
  background: #FFFFFF;
  border: 3px solid #CBD5E1;
  border-bottom: 6px solid #94A3B8;
  border-radius: 22px;
  cursor: pointer;
  color: var(--ink);
  transition: all .12s cubic-bezier(0.2, 0, 0, 1);
  display: flex;
  align-items: center;
  justify-content: center;
}
.tile-btn:active:not(:disabled) {
  transform: translateY(3px);
  border-bottom-width: 3px;
}

/* Modificadores de fichas */
.tile-letter {
  font-size: clamp(34px, 10vw, 48px);
  min-width: 66px;
  height: 68px;
  padding: 4px 10px;
}
.tile-syllable {
  font-size: clamp(28px, 8vw, 42px);
  min-width: 90px;
  height: 72px;
  padding: 6px 16px;
  letter-spacing: .05em;
  background: #F8FAFC;
  border-color: #93C5FD;
  border-bottom-color: #3B82F6;
  color: #1E40AF;
}
.tile-pic {
  width: clamp(96px, 28vw, 130px);
  height: clamp(96px, 28vw, 130px);
  font-size: clamp(54px, 15vw, 76px);
  border-color: #FED7AA;
  border-bottom-color: #FB923C;
  background: #FFFBF5;
}

/* Casillas de letras/sílabas (slots) */
.slots-container {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin: 10px 0 16px;
}
.slot-box {
  width: clamp(50px, 13vw, 68px);
  height: clamp(58px, 15vw, 76px);
  border-radius: 16px;
  background: #F1F5F9;
  border: 3px dashed #CBD5E1;
  border-bottom: 5px solid #94A3B8;
  font-size: clamp(34px, 9.5vw, 50px);
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all .2s;
}
.slot-box.filled {
  background: #EFF6FF;
  border-style: solid;
  border-color: #93C5FD;
  border-bottom-color: #3B82F6;
}

/* Ayudas y animaciones */
.tile-btn:disabled {
  opacity: .35;
  cursor: default;
  border-bottom-width: 3px;
  transform: translateY(3px);
}
.hint-glow {
  box-shadow: 0 0 0 6px #F59E0B, 0 0 20px rgba(245, 158, 11, 0.5) !important;
  animation: pulseHint 1s infinite alternate;
}
@keyframes pulseHint {
  from { transform: scale(1); }
  to { transform: scale(1.08); }
}
.shake {
  animation: shakeAnim .4s cubic-bezier(.36,.07,.19,.97) both;
}
@keyframes shakeAnim {
  10%, 90% { transform: translate3d(-3px, 0, 0); }
  20%, 80% { transform: translate3d(5px, 0, 0); }
  30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
  40%, 60% { transform: translate3d(6px, 0, 0); }
}

/* Confeti flotante de celebración */
.conf {
  position: fixed;
  top: -6vh;
  font-size: 32px;
  pointer-events: none;
  animation: fallDown 2.4s cubic-bezier(.25,.46,.45,.94) forwards;
  z-index: 99;
}
@keyframes fallDown {
  to { transform: translateY(110vh) rotate(640deg); }
}

/* Pantalla de inicio */
.overlay-screen {
  position: fixed;
  inset: 0;
  background: #F0F7FF;
  background-image: radial-gradient(#D6E8FA 20%, transparent 20%);
  background-size: 26px 26px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  z-index: 100;
  text-align: center;
  padding: 24px;
}
.overlay-screen .big-owl {
  font-size: clamp(80px, 24vw, 130px);
  animation: bounceOwl 1.8s infinite alternate ease-in-out;
}
@keyframes bounceOwl {
  from { transform: translateY(0) scale(1); }
  to { transform: translateY(-14px) scale(1.05); }
}
.overlay-screen h1 {
  font-size: clamp(28px, 8vw, 42px);
  font-weight: 800;
  color: #1E3A8A;
  margin: 0;
  line-height: 1.1;
}
.overlay-screen p {
  font-size: clamp(18px, 5vw, 24px);
  color: #334155;
  margin: 0;
  max-width: 440px;
}
.btn-primary {
  font: inherit;
  font-size: clamp(24px, 6.5vw, 32px);
  font-weight: 800;
  border: 0;
  background: #10B981;
  border-bottom: 7px solid #059669;
  color: #FFFFFF;
  border-radius: 999px;
  padding: 14px 44px;
  cursor: pointer;
  box-shadow: 0 10px 25px rgba(16, 185, 129, 0.35);
  transition: transform .1s;
}
.btn-primary:active {
  transform: translateY(4px);
  border-bottom-width: 3px;
}

/* Modal de Stickers Coleccionables */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.6);
  backdrop-filter: blur(4px);
  z-index: 110;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.modal.open { display: flex; }
.modal-content {
  background: var(--card);
  border: 4px solid #C084FC;
  border-radius: 28px;
  padding: 20px;
  width: 100%;
  max-width: 480px;
  text-align: center;
  max-height: 85vh;
  display: flex;
  flex-direction: column;
}
.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}
.modal-header h2 {
  font-size: 24px;
  margin: 0;
  color: #6B21A8;
}
.btn-close {
  background: #F1F5F9;
  border: 0;
  border-radius: 999px;
  width: 40px;
  height: 40px;
  font-size: 20px;
  cursor: pointer;
  font-weight: 800;
}
.stickers-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  overflow-y: auto;
  padding: 10px 4px;
}
.sticker-slot {
  background: #F8FAFC;
  border: 2px dashed #CBD5E1;
  border-radius: 18px;
  aspect-ratio: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-size: 36px;
}
.sticker-slot.unlocked {
  background: #FAF5FF;
  border: 2px solid #E9D5FF;
  animation: popIn .3s ease;
}
.sticker-slot.locked {
  filter: grayscale(1);
  opacity: .35;
  font-size: 24px;
}
.sticker-name {
  font-size: 11px;
  color: #475569;
  margin-top: 2px;
}

@media (prefers-reduced-motion: reduce) {
  .shake { animation: none; outline: 4px solid var(--vow); }
  .conf { display: none; }
  .overlay-screen .big-owl { animation: none; }
}
</style>
</head>
<body>

<!-- Pantalla de bienvenida interactiva -->
<div class="overlay-screen" id="start-screen">
  <div class="big-owl">🦉</div>
  <h1>¡Hola, Luciana!</h1>
  <p>Soy <b>Lula la lechuza</b>. ¡Vamos a jugar a leer palabras y descubrir sorpresas!</p>
  <button class="btn-primary" id="btn-start">▶ ¡A Jugar!</button>
</div>

<!-- Modal de Stickers Coleccionables -->
<div class="modal" id="stickers-modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>🏆 Álbum de Luciana</h2>
      <button class="btn-close" id="btn-close-modal">✕</button>
    </div>
    <p style="margin:0 0 8px;font-size:15px;color:#64748B">¡Ganá 3 estrellas para desbloquear cada sticker!</p>
    <div class="stickers-grid" id="stickers-grid"></div>
  </div>
</div>

<div class="app">
  <header>
    <div class="title-group">
      <h1>Luciana lee</h1>
    </div>
    <div class="header-badges">
      <a href="cuentos.html" class="stickers-btn" style="text-decoration:none;border-color:#FBCFE8;border-bottom-color:#F472B6;color:#BE185D" title="Leer cuentos mágicos y jugar en el castillo">👑 Cuentos y Castillo</a>
      <button class="stickers-btn" id="btn-open-stickers" title="Ver mis premios">🏆 <span id="stickers-count">0</span></button>
      <div class="stars" id="stars-badge">⭐ <span id="stars-count">0</span></div>
    </div>
  </header>

  <!-- Pestañas pedagógicas: Sin modo "escuchar", centradas en la lectura activa -->
  <nav role="tablist">
    <button role="tab" data-mode="syllables" aria-selected="true">
      <span class="icon">🧩</span>
      <span>Sílabas</span>
    </button>
    <button role="tab" data-mode="read" aria-selected="false">
      <span class="icon">👀</span>
      <span>¿Qué dice?</span>
    </button>
    <button role="tab" data-mode="first" aria-selected="false">
      <span class="icon">🔤</span>
      <span>¿Con cuál va?</span>
    </button>
    <button role="tab" data-mode="build" aria-selected="false">
      <span class="icon">✏️</span>
      <span>Armá</span>
    </button>
  </nav>

  <!-- Mascota Lula con su burbuja de habla -->
  <div class="guide">
    <div class="owl-wrap">
      <button class="owl" id="btn-owl" aria-label="Repetir lo que dijo Lula">🦉</button>
    </div>
    <div class="bub" id="speech-bubble">¡Tocá las sílabas para formar la palabra!</div>
  </div>

  <!-- Contenedor principal de actividades -->
  <main class="panel" id="main-panel"></main>
</div>

<script>
/* ========================================================
   BANCO DE PALABRAS GRADUADO PARA 5 AÑOS (Enfoque Silábico)
   Imprenta mayúscula, consonantes directas (M, P, S, L, T, C, G, N, B, R)
   ======================================================== */
const WORDS_DATA = [
  { word: "SAPO", pic: "🐸", syllables: ["SA", "PO"], initial: "S" },
  { word: "PATO", pic: "🦆", syllables: ["PA", "TO"], initial: "P" },
  { word: "LUNA", pic: "🌙", syllables: ["LU", "NA"], initial: "L" },
  { word: "SOL",  pic: "☀️", syllables: ["SOL"],       initial: "S" },
  { word: "MESA", pic: "🪑", syllables: ["ME", "SA"], initial: "M" },
  { word: "SOPA", pic: "🍲", syllables: ["SO", "PA"], initial: "S" },
  { word: "CASA", pic: "🏠", syllables: ["CA", "SA"], initial: "C" },
  { word: "GATO", pic: "🐱", syllables: ["GA", "TO"], initial: "G" },
  { word: "MONO", pic: "🐵", syllables: ["MO", "NO"], initial: "M" },
  { word: "OSO",  pic: "🐻", syllables: ["O", "SO"],   initial: "O" },
  { word: "ROSA", pic: "🌹", syllables: ["RO", "SA"], initial: "R" },
  { word: "LECHE",pic: "🥛", syllables: ["LE", "CHE"],initial: "L" },
  { word: "BOCA", pic: "👄", syllables: ["BO", "CA"], initial: "B" },
  { word: "MANO", pic: "🖐️", syllables: ["MA", "NO"], initial: "M" },
  { word: "NUBE", pic: "☁️", syllables: ["NU", "BE"], initial: "N" },
  { word: "PELOTA", pic: "⚽", syllables: ["PE", "LO", "TA"], initial: "P" },
  { word: "TOMATE", pic: "🍅", syllables: ["TO", "MA", "TE"], initial: "T" },
  { word: "LUCIANA",pic: "👧", syllables: ["LU", "CIA", "NA"], initial: "L" }
];

const STICKERS_CATALOG = [
  { icon: "🦄", name: "Unicornio" },
  { icon: "🐬", name: "Delfín" },
  { icon: "🦋", name: "Mariposa" },
  { icon: "👑", name: "Corona" },
  { icon: "🍧", name: "Heladito" },
  { icon: "🚀", name: "Cohete" },
  { icon: "🌺", name: "Florcita" },
  { icon: "🎨", name: "Pintora" },
  { icon: "🐼", name: "Panda" },
  { icon: "🌈", name: "Arcoíris" },
  { icon: "🧁", name: "Cupcake" },
  { icon: "⭐", name: "Súper Estrella" }
];

const VOWELS = "AEIOU";
const CONSONANTS = "MPSLTNDBCRGF";
const PRAISES = [
  "¡Muy bien, Luchi!",
  "¡Genial, lo leíste!",
  "¡Bravo, qué capa!",
  "¡Excelente lectura!",
  "¡Hermoso, Luciana!",
  "¡Sos una súper lectora!"
];

/* ========================================================
   ESTADO Y AUDIO SINTETIZADO (Web Speech API + Web Audio)
   ======================================================== */
const $ = sel => document.querySelector(sel);
const mainPanel = $("#main-panel");
let stars = 0;
let unlockedStickers = [];
let currentVoice = null;
let lastSpokenText = "";
let lastWordObj = null;
let currentMode = "syllables";
let roundTimer = null;
let wrongAttempts = 0;

// Variables de control de lectura silábica interactiva
let syllableSequenceTimer = null;
let isReadingSyllables = false;

// Cargar progreso guardado
try {
  stars = +localStorage.getItem("luchi_stars") || 0;
  const savedStickers = localStorage.getItem("luchi_stickers");
  if (savedStickers) unlockedStickers = JSON.parse(savedStickers);
} catch (e) {}

// Configuración de voz optimizada con selección de voces naturales
function initVoice() {
  try {
    const voices = speechSynthesis.getVoices().filter(v => /^es[-_]/i.test(v.lang) || v.lang.startsWith("es"));
    const savedVoice = localStorage.getItem("luchi_chosen_voice");
    if (savedVoice) {
      const match = voices.find(v => v.name === savedVoice);
      if (match) { currentVoice = match; return; }
    }
    const scored = [...voices].sort((a,b) => {
      const getScore = (v) => {
        let s = 0;
        const n = v.name.toLowerCase();
        if (/natural|online|neural/i.test(n)) s += 50;
        if (/salma|dalia|elena|sabina|paulina|mónica|monica|laura/i.test(n)) s += 30;
        if (/google/i.test(n)) s += 25;
        if (/es-ar/i.test(v.lang)) s += 20;
        if (/es-419|es-mx/i.test(v.lang)) s += 15;
        return s;
      };
      return getScore(b) - getScore(a);
    });
    currentVoice = scored[0] || voices[0] || null;
  } catch(e) {}
}
if ("speechSynthesis" in window) {
  initVoice();
  speechSynthesis.onvoiceschanged = initVoice;
}

// Síntesis de voz optimizada para niños pequeños
function speak(text, rate = 0.82, pitch = 1.22) {
  if (!("speechSynthesis" in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.toLowerCase());
    u.lang = currentVoice ? currentVoice.lang : "es-AR";
    if (currentVoice) u.voice = currentVoice;
    u.rate = rate;
    u.pitch = pitch;
    speechSynthesis.speak(u);
  } catch (e) {}
}

// Campanita de cristal para sílabas
function playChime(freq = 880) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(freq, ctx.currentTime);
    gain.gain.setValueAtTime(0.12, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.32);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.33);
  } catch(e) {}
}

// Pequeños efectos de sonido sintetizados (alegres y limpios)
function playBeep(freq = 520, duration = 0.12, type = "sine") {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ctx.currentTime);
    gain.gain.setValueAtTime(0.18, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + duration);
  } catch(e) {}
}

function playSuccessTune() {
  playBeep(523.25, 0.1); // C5
  setTimeout(() => playBeep(659.25, 0.1), 100); // E5
  setTimeout(() => playBeep(783.99, 0.25), 200); // G5
}

function lulaSays(text, speakToo = true) {
  lastSpokenText = text;
  $("#speech-bubble").textContent = text;
  if (speakToo) speak(text);
}

$("#btn-owl").onclick = () => {
  if (lastSpokenText) speak(lastSpokenText);
};

/* ========================================================
   UTILIDADES Y FORMATO DE PALABRAS
   ======================================================== */
const rnd = arr => arr[Math.floor(Math.random() * arr.length)];
const shuffle = arr => arr.map(x => [Math.random(), x]).sort((a,b) => a[0]-b[0]).map(x => x[1]);

// Colorear vocales en rojo cálido y consonantes en azul
function formatColoredLetters(text) {
  return [...text].map(letter => {
    const isVowel = VOWELS.includes(letter);
    return `<span class="${isVowel ? 'v' : 'c'}">${letter}</span>`;
  }).join("");
}

// Genera el HTML de una palabra separada por trozos silábicos interactivos
function buildInteractiveWordHTML(syllables, containerClass = "") {
  const chunks = syllables.map((syl, index) => {
    return `<span class="syllable-chunk" data-syl="${syl}" data-idx="${index}" title="Sílaba ${syl}">${formatColoredLetters(syl)}</span>`;
  }).join("");
  return `<div class="word-interactive-container ${containerClass}" role="button" aria-label="Escuchar palabra por sílabas">${chunks}</div>`;
}

/* ========================================================
   LECTURA INTERACTIVA AL PASAR EL MOUSE (Hover Sílaba por Sílaba)
   ======================================================== */
function stopSyllableReading(container) {
  if (syllableSequenceTimer) {
    clearTimeout(syllableSequenceTimer);
    syllableSequenceTimer = null;
  }
  isReadingSyllables = false;
  if (container) {
    container.classList.remove("complete-highlight");
    container.querySelectorAll(".syllable-chunk").forEach(c => c.classList.remove("highlighted"));
  }
}

function playWordBySyllables(syllables, fullWord, container) {
  if (!container) return;
  stopSyllableReading(container);
  isReadingSyllables = true;

  const chunks = container.querySelectorAll(".syllable-chunk");
  let step = 0;

  function advance() {
    chunks.forEach(c => c.classList.remove("highlighted"));
    container.classList.remove("complete-highlight");

    if (step < syllables.length) {
      const currentSyl = syllables[step];
      if (chunks[step]) {
        chunks[step].classList.add("highlighted");
      }
      playChime(720 + step * 110);
      // Pronunciar la sílaba con tono amigable y pausado
      speak(currentSyl, 0.78, 1.25);
      step++;
      syllableSequenceTimer = setTimeout(advance, 720);
    } else {
      // Al terminar las sílabas, resaltar la palabra entera y pronunciarla completa
      container.classList.add("complete-highlight");
      speak(fullWord, 0.85, 1.18);
      syllableSequenceTimer = setTimeout(() => {
        container.classList.remove("complete-highlight");
        isReadingSyllables = false;
      }, 1300);
    }
  }

  advance();
}

// Conectar eventos de hover y touch a un contenedor de palabra
function bindWordHoverEvents(container, syllables, fullWord) {
  if (!container) return;

  // Al pasar el cursor del mouse por encima del bloque de la palabra
  container.addEventListener("mouseenter", () => {
    playWordBySyllables(syllables, fullWord, container);
  });

  // En celulares y tablets, al tocar con el dedo
  container.addEventListener("click", () => {
    playWordBySyllables(syllables, fullWord, container);
  });

  // Si pasa el mouse o toca específicamente una sílaba individual
  container.querySelectorAll(".syllable-chunk").forEach(chunk => {
    chunk.addEventListener("mouseenter", (e) => {
      e.stopPropagation();
      if (!isReadingSyllables) {
        chunk.classList.add("highlighted");
        playChime(880);
        speak(chunk.dataset.syl, 0.8, 1.25);
      }
    });
    chunk.addEventListener("mouseleave", () => {
      if (!isReadingSyllables) {
        chunk.classList.remove("highlighted");
      }
    });
  });
}

function updateBadges() {
  $("#stars-count").textContent = stars;
  $("#stickers-count").textContent = unlockedStickers.length;
}

function triggerConfetti(count = 16) {
  const icons = ["⭐", "🎉", "✨", "💖", "🌸", "🎈", "🌈"];
  for (let i = 0; i < count; i++) {
    const s = document.createElement("span");
    s.className = "conf";
    s.textContent = rnd(icons);
    s.style.left = Math.random() * 92 + "vw";
    s.style.animationDelay = (Math.random() * 0.4) + "s";
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 2600);
  }
}

function handleWin(wordCompleted, nextRoundFn) {
  stars++;
  playSuccessTune();
  
  // Revisar si desbloqueó un nuevo sticker (cada 3 estrellas)
  const stickersEarned = Math.floor(stars / 3);
  let newSticker = null;
  if (stickersEarned > unlockedStickers.length && unlockedStickers.length < STICKERS_CATALOG.length) {
    newSticker = STICKERS_CATALOG[unlockedStickers.length];
    unlockedStickers.push(newSticker.icon);
    try { localStorage.setItem("luchi_stickers", JSON.stringify(unlockedStickers)); } catch(e){}
  }

  updateBadges();
  try { localStorage.setItem("luchi_stars", stars); } catch(e){}

  if (newSticker) {
    triggerConfetti(36);
    lulaSays(`¡Ganaste un nuevo sticker: ${newSticker.name}! ¡Sos una genia, Luciana!`);
  } else if (stars % 5 === 0) {
    triggerConfetti(30);
    lulaSays(`¡Ya tenés ${stars} estrellas! ¡Qué bien que estás leyendo!`);
  } else {
    triggerConfetti(14);
    lulaSays(`${rnd(PRAISES)} ¡Leíste ${wordCompleted}!`);
  }

  roundTimer = setTimeout(nextRoundFn, 2600);
}

function shakeElement(el) {
  el.classList.remove("shake");
  void el.offsetWidth;
  el.classList.add("shake");
  playBeep(220, 0.15, "triangle");
}

function getWordForRound() {
  let pool = WORDS_DATA.filter(item => {
    if (stars < 8) return item.syllables.length <= 2 && item.word.length <= 4;
    return true;
  });
  let chosen;
  do {
    chosen = rnd(pool);
  } while (lastWordObj && chosen.word === lastWordObj.word && pool.length > 1);
  lastWordObj = chosen;
  return chosen;
}

/* ========================================================
   MODO 1: 🧩 SÍLABAS (Método Fonético Silábico)
   ======================================================== */
function playSyllablesMode() {
  clearTimeout(roundTimer);
  stopSyllableReading();
  wrongAttempts = 0;
  const current = getWordForRound();
  const syllables = current.syllables;

  let options = [];
  if (syllables.length === 1) {
    options = [syllables[0], "PA", "LU"];
  } else {
    options = [...syllables];
    const distractor = rnd(["MA", "PA", "SO", "TE", "LA", "NO"].filter(s => !syllables.includes(s)));
    options.push(distractor);
  }
  options = shuffle(options);

  let step = 0;
  const placed = [];

  mainPanel.innerHTML = `
    <div class="big-pic">${current.pic}</div>
    <div class="hover-tip">👆 Pasá el mouse sobre cada sílaba para escucharla</div>
    <div class="slots-container" id="syllable-slots">
      ${syllables.map(() => `<div class="slot-box" style="width: clamp(72px, 20vw, 104px);">?</div>`).join("")}
    </div>
    <div class="options-grid" id="syllables-pool">
      ${options.map((syl, idx) => `<button class="tile-btn tile-syllable" data-syl="${syl}" data-idx="${idx}">${syl}</button>`).join("")}
    </div>
  `;

  lulaSays(`Mirá el dibujo: ${current.pic}. ¿Qué sílaba va primero?`);

  const slots = mainPanel.querySelectorAll(".slot-box");
  const buttons = mainPanel.querySelectorAll("#syllables-pool button");

  buttons.forEach(btn => {
    btn.addEventListener("mouseenter", () => {
      if (!btn.disabled) {
        playChime(850);
        speak(btn.dataset.syl, 0.85, 1.25);
      }
    });
  });

  const highlightNext = () => {
    buttons.forEach(btn => {
      btn.classList.remove("hint-glow");
      if (!btn.disabled && btn.dataset.syl === syllables[step]) {
        btn.classList.add("hint-glow");
      }
    });
  };

  buttons.forEach(btn => {
    btn.onclick = () => {
      const syl = btn.dataset.syl;
      speak(syl);

      if (syl === syllables[step]) {
        btn.disabled = true;
        btn.classList.remove("hint-glow");
        slots[step].innerHTML = formatColoredLetters(syl);
        slots[step].classList.add("filled");
        placed.push(syl);
        step++;
        wrongAttempts = 0;

        if (step < syllables.length) {
          lulaSays(`¡Muy bien! Ahora tocá ${syllables[step]}`, false);
        } else {
          buttons.forEach(b => b.disabled = true);
          const slotsContainer = $("#syllable-slots");
          slotsContainer.innerHTML = buildInteractiveWordHTML(syllables, "complete-highlight");
          const wordBox = slotsContainer.querySelector(".word-interactive-container");
          bindWordHoverEvents(wordBox, syllables, current.word);
          playWordBySyllables(syllables, current.word, wordBox);
          handleWin(current.word, playSyllablesMode);
        }
      } else {
        wrongAttempts++;
        shakeElement(btn);
        lulaSays(`Esa es ${syl}. Busquemos la sílaba ${syllables[step]}`);
        if (wrongAttempts >= 2) highlightNext();
      }
    };
  });
}

/* ========================================================
   MODO 2: 👀 ¿QUÉ DICE? (Con lectura interactiva por sílabas)
   ======================================================== */
function playReadMode() {
  clearTimeout(roundTimer);
  stopSyllableReading();
  wrongAttempts = 0;
  const target = getWordForRound();
  
  const otherWords = shuffle(WORDS_DATA.filter(w => w.word !== target.word)).slice(0, 2);
  const options = shuffle([target, ...otherWords]);

  mainPanel.innerHTML = `
    <div class="hover-tip">✨ Pasá el mouse sobre la palabra para escuchar cómo se lee</div>
    <div id="target-word-container">
      ${buildInteractiveWordHTML(target.syllables)}
    </div>
    <div class="helper-row">
      <button class="btn-sound" id="btn-read-aloud">🗣️ Leer sílaba por sílaba</button>
    </div>
    <div class="options-grid">
      ${options.map(opt => `<button class="tile-btn tile-pic" data-word="${opt.word}">${opt.pic}</button>`).join("")}
    </div>
  `;

  lulaSays(`Leé la palabra que está arriba. Pasá el mouse sobre ella para escucharla.`);

  const wordContainer = mainPanel.querySelector(".word-interactive-container");
  bindWordHoverEvents(wordContainer, target.syllables, target.word);

  $("#btn-read-aloud").onclick = () => {
    playWordBySyllables(target.syllables, target.word, wordContainer);
  };

  const buttons = mainPanel.querySelectorAll(".tile-pic");
  buttons.forEach(btn => {
    btn.onclick = () => {
      const selected = btn.dataset.word;
      if (selected === target.word) {
        buttons.forEach(b => b.disabled = true);
        btn.disabled = false;
        playWordBySyllables(target.syllables, target.word, wordContainer);
        handleWin(target.word, playReadMode);
      } else {
        wrongAttempts++;
        shakeElement(btn);
        const wrongItem = WORDS_DATA.find(w => w.word === selected);
        lulaSays(`Ese es un ${wrongItem.word.toLowerCase()}. Volvé a leer la palabra.`);
        if (wrongAttempts >= 2) {
          buttons.forEach(b => {
            if (b.dataset.word === target.word) b.classList.add("hint-glow");
          });
        }
      }
    };
  });
}

/* ========================================================
   MODO 3: 🔤 ¿CON CUÁL VA? (Conciencia Fonológica)
   ======================================================== */
function playFirstSoundMode() {
  clearTimeout(roundTimer);
  stopSyllableReading();
  wrongAttempts = 0;
  const current = getWordForRound();
  const firstSyllable = current.syllables[0];

  const candidateSyllables = ["MA", "PA", "SA", "LA", "CA", "TO", "RO", "SO", "PE", "LU", "BO", "NO"];
  const distractors = shuffle(candidateSyllables.filter(s => s !== firstSyllable)).slice(0, 2);
  const options = shuffle([firstSyllable, ...distractors]);

  const restOfWord = current.syllables.slice(1).join("");
  const previewTemplate = `<span style="color:#F59E0B">_ _</span>${restOfWord ? formatColoredLetters(restOfWord) : ""}`;

  mainPanel.innerHTML = `
    <div class="big-pic">${current.pic}</div>
    <div class="hover-tip">👆 Pasá el mouse sobre las sílabas para oírlas</div>
    <div id="first-word-box" style="font-size:clamp(42px,13vw,68px);font-weight:800;letter-spacing:.08em;margin:4px 0 10px;">
      ${previewTemplate}
    </div>
    <div class="options-grid">
      ${options.map(opt => `<button class="tile-btn tile-syllable" style="font-size:clamp(32px,9vw,46px);padding:10px 24px" data-syl="${opt}">${opt}</button>`).join("")}
    </div>
  `;

  lulaSays(`¿Con qué sílaba empieza ${current.word.toLowerCase()}?`);

  const buttons = mainPanel.querySelectorAll(".tile-syllable");
  buttons.forEach(btn => {
    btn.addEventListener("mouseenter", () => {
      playChime(850);
      speak(btn.dataset.syl, 0.85, 1.25);
    });

    btn.onclick = () => {
      const syl = btn.dataset.syl;
      speak(syl);
      if (syl === firstSyllable) {
        buttons.forEach(b => b.disabled = true);
        btn.disabled = false;
        
        const wordBox = $("#first-word-box");
        wordBox.innerHTML = buildInteractiveWordHTML(current.syllables);
        const interactiveBox = wordBox.querySelector(".word-interactive-container");
        bindWordHoverEvents(interactiveBox, current.syllables, current.word);
        playWordBySyllables(current.syllables, current.word, interactiveBox);

        handleWin(current.word, playFirstSoundMode);
      } else {
        wrongAttempts++;
        shakeElement(btn);
        lulaSays(`Dice ${syl}. Pensá cómo empieza ${current.word.toLowerCase()}`);
        if (wrongAttempts >= 2) {
          buttons.forEach(b => {
            if (b.dataset.syl === firstSyllable) b.classList.add("hint-glow");
          });
        }
      }
    };
  });
}

/* ========================================================
   MODO 4: ✏️ ARMÁ (Construcción con Letras Mayúsculas)
   ======================================================== */
function playBuildMode() {
  clearTimeout(roundTimer);
  stopSyllableReading();
  wrongAttempts = 0;
  const current = getWordForRound();
  const word = current.word;
  const letters = [...word];

  const extraLetters = shuffle([...(VOWELS + CONSONANTS)].filter(l => !word.includes(l))).slice(0, 1);
  const letterPool = shuffle([...letters, ...extraLetters]);

  let currentPos = 0;

  mainPanel.innerHTML = `
    <div class="big-pic">${current.pic}</div>
    <div class="hover-tip">👆 Podés pasar el mouse sobre la palabra para escucharla</div>
    <div id="build-guide-container">
      ${buildInteractiveWordHTML(current.syllables)}
    </div>
    <div class="slots-container">
      ${letters.map(() => `<div class="slot-box letter-slot">_</div>`).join("")}
    </div>
    <div class="options-grid" id="letters-pool">
      ${letterPool.map((letter, i) => `<button class="tile-btn tile-letter" data-letter="${letter}" data-id="${i}">${letter}</button>`).join("")}
    </div>
  `;

  lulaSays(`Tocá las letras en orden para armar ${word}.`);

  const guideContainer = mainPanel.querySelector(".word-interactive-container");
  bindWordHoverEvents(guideContainer, current.syllables, word);

  const slots = mainPanel.querySelectorAll(".letter-slot");
  const buttons = mainPanel.querySelectorAll("#letters-pool button");

  buttons.forEach(b => {
    b.addEventListener("mouseenter", () => {
      if (!b.disabled) {
        playChime(800);
        speak(b.dataset.letter, 0.85, 1.25);
      }
    });
  });

  const highlightNextLetter = () => {
    buttons.forEach(b => {
      b.classList.remove("hint-glow");
      if (!b.disabled && b.dataset.letter === letters[currentPos]) {
        b.classList.add("hint-glow");
      }
    });
  };

  buttons.forEach(btn => {
    btn.onclick = () => {
      const char = btn.dataset.letter;
      speak(char);

      if (char === letters[currentPos]) {
        btn.disabled = true;
        btn.classList.remove("hint-glow");
        slots[currentPos].innerHTML = formatColoredLetters(char);
        slots[currentPos].classList.add("filled");
        currentPos++;
        wrongAttempts = 0;

        if (currentPos < letters.length) {
          if (wrongAttempts >= 2) highlightNextLetter();
        } else {
          buttons.forEach(b => b.disabled = true);
          playWordBySyllables(current.syllables, word, guideContainer);
          handleWin(word, playBuildMode);
        }
      } else {
        wrongAttempts++;
        shakeElement(btn);
        lulaSays(`Esa es la letra ${char}. Ahora necesitamos la ${letters[currentPos]}.`);
        if (wrongAttempts >= 2) highlightNextLetter();
      }
    };
  });
}

/* ========================================================
   CONTROLADORES DE NAVEGACIÓN Y MODAL DE STICKERS
   ======================================================== */
const modeHandlers = {
  syllables: playSyllablesMode,
  read: playReadMode,
  first: playFirstSoundMode,
  build: playBuildMode
};

document.querySelectorAll("nav button").forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll("nav button").forEach(b => b.setAttribute("aria-selected", "false"));
    tab.setAttribute("aria-selected", "true");
    currentMode = tab.dataset.mode;
    modeHandlers[currentMode]();
  };
});

// Modal de Stickers
function renderStickersModal() {
  const grid = $("#stickers-grid");
  grid.innerHTML = STICKERS_CATALOG.map((st, idx) => {
    const isUnlocked = idx < unlockedStickers.length;
    return `
      <div class="sticker-slot ${isUnlocked ? 'unlocked' : 'locked'}">
        <div>${isUnlocked ? st.icon : "🔒"}</div>
        <div class="sticker-name">${isUnlocked ? st.name : `${(idx + 1) * 3} ⭐`}</div>
      </div>
    `;
  }).join("");
}

$("#btn-open-stickers").onclick = () => {
  renderStickersModal();
  $("#stickers-modal").classList.add("open");
};

$("#btn-close-modal").onclick = () => {
  $("#stickers-modal").classList.remove("open");
};

$("#stickers-modal").onclick = (e) => {
  if (e.target === $("#stickers-modal")) {
    $("#stickers-modal").classList.remove("open");
  }
};

// Inicio del juego con desbloqueo de audio
$("#btn-start").onclick = () => {
  $("#start-screen").style.display = "none";
  updateBadges();
  playSuccessTune();
  modeHandlers[currentMode]();
};

updateBadges();
