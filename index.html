<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ajedrez de las letras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#2C2350;--muted:#6B6390;--paper:#fff;--bg:#F1ECFF;--dot:#E5DDFB;--line:#DCD3F5;--vow:#E5405E;--con:#2563EB;--grape:#7C4DDB;--pink:#FF5FA2;--sun:#FFC83D;--ok:#22A35A;
  --sq1:#FFF6E3;--sq2:#C9B6F2;--shadow:rgba(44,35,80,.14);
  --f-ui:"Baloo 2","Trebuchet MS",system-ui,sans-serif;--f-read:"Andika","Century Gothic","Trebuchet MS",sans-serif;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:var(--bg);height:100%;overflow:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
body{margin:0;background:var(--bg) radial-gradient(var(--dot) 18%,transparent 19%) 0 0/26px 26px;color:var(--ink);font-family:var(--f-ui);font-weight:800;font-size:18px;line-height:1.3;height:100%;overflow:hidden;overscroll-behavior:none;
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:4px solid var(--sun);outline-offset:2px}
.app{position:relative;height:100vh;height:100dvh;max-width:620px;margin:0 auto;padding-block:max(4px,env(safe-area-inset-top,0px)) max(4px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px}
.top{flex:none;display:flex;align-items:center;gap:8px}
.ttl{flex:1;min-width:0;font-size:clamp(18px,5vw,24px);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{flex:none;padding:0 10px;border-radius:999px;background:var(--paper);border:3px solid #FFE08A;font-size:19px;color:#8A5A00}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:54px;padding:6px 14px;border-radius:18px;background:var(--paper);border:3px solid var(--line);border-bottom-width:6px;font-size:18px}
.btn:active,.opt:active,.wc:active{transform:translateY(3px)}
.btn.go{background:var(--ok);border-color:#17803F;color:#fff}
.btn.sun{background:#FFF4D6;border-color:var(--sun)}
.btn.armed{outline:4px solid var(--sun)}
.row{display:flex;gap:6px;flex:none;margin-top:auto}
.row .btn{flex:1;min-width:0;min-height:44px;padding:2px 4px;border-radius:14px;border-bottom-width:4px;font-size:clamp(14px,4vw,17px);white-space:nowrap}

/* Panel de la letra */
.panel{flex:1;min-height:0;overflow:auto;background:var(--paper);border:3px solid var(--line);border-radius:18px;padding:4px 8px;text-align:center}
.panel{display:flex;flex-direction:column}.panel>:first-child{margin-top:auto}.panel>:last-child{margin-bottom:auto}
.panel.asking{position:absolute;left:0;right:0;bottom:max(4px,env(safe-area-inset-bottom,0px));z-index:7;max-height:var(--sheet);border-color:var(--grape);box-shadow:0 -4px 0 var(--shadow);--row:clamp(40px,calc((var(--sheet) - 90px)/3),72px)}
.ofl{font-size:clamp(18px,5vw,24px);line-height:1.15}
.ofl .L{font-family:var(--f-read);font-size:1.6em;color:var(--vow)}
.ofl .w{font-family:var(--f-read)}
.hintline{color:var(--muted);font-size:clamp(14px,3.9vw,16px);line-height:1.2;margin-top:2px}
.ideas{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:6px}
.wc{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;background:#F7F3FF;border:2px solid var(--line);border-bottom-width:4px;font-family:var(--f-read);font-size:clamp(15px,4.2vw,18px);line-height:1.2}
.wc b{color:var(--vow);font-size:1.15em}
.wc .e{font-size:1.25em;font-family:var(--f-ui)}

/* Pregunta antes de mover: dibujo al costado de cada palabra */
.ask{font-size:clamp(17px,4.6vw,20px);line-height:1.15;margin-top:2px}
.qrows{display:grid;gap:5px;margin-top:4px}
.qopt{display:flex;align-items:center;gap:10px;min-height:var(--row,48px);padding:2px 14px;border-radius:16px;background:var(--paper);border:3px solid var(--line);border-bottom-width:5px;font-family:var(--f-read);font-size:clamp(19px,5.2vw,24px);line-height:1;text-align:left}
.qopt:active{transform:translateY(2px)}
.qopt .e{font-size:calc(var(--row,48px)*.62);line-height:1;font-family:var(--f-ui)}
.qopt b{color:var(--vow)}
.qopt.no{animation:shake .45s}
.reward{display:flex;align-items:center;justify-content:center;gap:10px;text-align:left}
.reward .pic{font-size:clamp(40px,12vw,60px);line-height:1}
.reward .bigw{font-family:var(--f-read);font-size:clamp(24px,7vw,34px);line-height:1.05}
.reward .bigw b{color:var(--vow)}

/* Tablero */
.board{position:relative;flex:none;width:var(--bs,100%);aspect-ratio:1;margin-inline:auto;border-radius:10px;overflow:hidden;border:3px solid #5B4B8A;background:var(--sq1);touch-action:manipulation}
.sq{position:absolute;width:12.5%;height:12.5%;display:grid;place-items:center;padding:0;border:0;background:var(--sq1)}
.sq.d{background:var(--sq2)}
.sq.sel{box-shadow:inset 0 0 0 4px var(--sun)}
.sq.help{box-shadow:inset 0 0 0 5px var(--ok);animation:pulse .7s infinite alternate}
@keyframes pulse{to{box-shadow:inset 0 0 0 2px var(--ok)}}
.sq.last{background:#FFE9A8}
.sq i{display:block;width:30%;height:30%;border-radius:50%;background:rgba(34,163,90,.8);box-shadow:0 0 0 2px rgba(255,255,255,.7)}
.sq i.cap{width:90%;height:90%;background:transparent;box-shadow:inset 0 0 0 4px rgba(229,64,94,.8)}
.pc{position:absolute;width:12.5%;height:12.5%;display:grid;place-items:center;pointer-events:none;transition:left .28s ease,top .28s ease,opacity .25s,transform .25s}
.pc svg{width:96%;height:96%;filter:drop-shadow(0 2px 0 rgba(0,0,0,.18))}
.pc.gone{opacity:0;transform:scale(.3)}

/* Tarjetas */
.ov{position:fixed;inset:0;z-index:20;display:flex;padding:10px;background:rgba(44,35,80,.5);overflow:auto}
.box{margin:auto;width:min(520px,100%);background:var(--paper);border:5px solid var(--grape);border-radius:24px;padding:12px 14px 14px;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.15)}
.box h2{margin:0;font-size:clamp(20px,5.4vw,25px);line-height:1.15}
.box h3{margin:10px 0 0;font-size:18px;color:var(--muted)}
.box .pcbig{width:62px;height:62px;display:block;margin:0 auto}
.bigL{font-family:var(--f-read);color:var(--vow);font-size:clamp(50px,15vw,70px);line-height:1}
.opts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px}
.opt{width:30%;min-width:98px;min-height:110px;padding:6px 4px;border-radius:20px;background:var(--paper);border:3px solid var(--line);border-bottom-width:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;line-height:1.05}
.opt .e{font-size:44px;line-height:1}
.opt .w{font-family:var(--f-read);font-size:clamp(14px,3.9vw,18px)}
.opt .w b{color:var(--vow);font-size:1.25em}
.opt.good{background:#DFF7E6;border-color:var(--ok)}
.opt.no{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.tabs{display:flex;gap:6px;justify-content:center;margin-top:8px}
.tabs button{min-width:50px;min-height:50px;border-radius:14px;background:var(--paper);border:3px solid var(--line);border-bottom-width:5px;font-family:var(--f-read);font-size:26px}
.tabs button.on{background:#FFF0B8;border-color:var(--sun)}
.bigwin{font-size:clamp(32px,9vh,80px);line-height:1.1}
.box .row{position:sticky;bottom:0;margin-top:8px;padding-block:4px;background:var(--paper)}

/* Lula */
.lula{flex:none}
.lula .in{display:flex;align-items:center;gap:6px;height:60px}
.owl{flex:none;width:52px;height:52px;padding:0;border-radius:50%;background:#FFF4D6 url(luciana-bruja-2.png) no-repeat -38px -38px/128px auto;border:3px solid var(--sun)}
.hero{display:block;height:min(38vh,340px);width:auto;margin:0 auto}
.bubble{flex:1;min-width:0;height:100%;display:flex;align-items:center;background:var(--paper);border:3px solid var(--line);border-radius:14px 14px 14px 4px;padding:2px 8px;font-size:clamp(13px,3.7vw,16px);line-height:1.12;overflow:auto}
.confetti{position:fixed;top:-40px;z-index:25;pointer-events:none;font-size:26px;animation:conf 1.6s linear forwards}
@keyframes conf{to{transform:translateY(110vh) rotate(540deg)}}
.start{position:fixed;inset:0;z-index:30;background:var(--bg);display:grid;place-items:center;text-align:center;padding:12px;overflow:auto}
.start svg{width:140px;height:140px}
.start h1{font-family:var(--f-read);font-size:clamp(38px,11vw,58px);margin:4px 0;line-height:1.05}
.start p{color:var(--muted);margin:0 0 16px}
.start .btn{font-size:28px;min-height:72px;padding:8px 36px}
@media (max-height:640px){
  .box{padding:8px 10px 10px}.box .pcbig{width:44px;height:44px}.bigL{font-size:44px}
  .opt{min-height:88px}.opt .e{font-size:36px}.bigwin{font-size:26px}.start svg{width:96px;height:96px}
  .opts:has(.good) .opt:not(.good){display:none}
}
/* Celular acostado: tablero a la izquierda, todo lo demás a la derecha */
@media (orientation:landscape) and (max-height:560px){
  .app{max-width:none;display:grid;grid-template-columns:var(--bs) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto;column-gap:10px}
  .board{grid-column:1;grid-row:1/5;align-self:center}
  .top,.panel,.row,.lula{grid-column:2}
  .top{grid-row:1}.panel{grid-row:2}.row{grid-row:3}.lula{grid-row:4}
  .row{margin-top:0}
  .bubble{font-size:14px}
  .panel.asking{grid-row:1/5;left:0;right:0;top:0;bottom:0;--row:clamp(40px,calc((var(--sheet) - 90px)/3),64px)}
  .box{width:min(640px,100%)}.box .pcbig,.bigL{display:none}.opt{min-height:76px}.opt .e{font-size:30px}
  .start>div{display:grid;grid-template-columns:auto 1fr;align-items:center;column-gap:12px}.start h1{font-size:32px}.start p{margin-bottom:6px}.start .btn{grid-column:2;min-height:54px;font-size:22px;justify-self:center}#startPc{grid-row:1/4}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top"><div class="ttl">♟️ Ajedrez de las letras</div><span class="pill">⭐ <span id="nstar">0</span></span></header>
  <div class="board" id="bd"></div>
  <div class="panel" id="info"></div>
  <div class="row" id="tools">
    <button class="btn sun" id="help" aria-label="Ayuda">💡 Ayuda</button>
    <button class="btn" id="dict" aria-label="Palabras">📖 Palabras</button>
    <button class="btn" id="re" aria-label="Partida nueva">🔄 Nueva</button>
  </div>
  <div class="lula"><div class="in"><button class="owl" id="owl" aria-label="Repetir"></button><div class="bubble" id="bubble">¡Hola!</div></div></div>
</div>
<div class="start" id="start"><div><img class="hero" id="startPc" src="luciana-bruja-2.png" alt="Luciana de brujita"><h1>Ajedrez de las letras</h1><p>Cada pieza tiene su letra y sus palabras</p><button class="btn go" id="startBtn">¡Jugar! ▶</button><a class="btn" href="experimentos.html" style="display:flex;width:fit-content;margin:10px auto 0;min-height:60px;font-size:22px;padding:6px 24px;color:inherit;text-decoration:none">🧪 Experimentos</a></div></div>

<script>
/* ---------- utilidades ---------- */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.random()*a.length|0];
const wait=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------- guardado ---------- */
const DEF={stars:0,wins:0,game:null,moves:0,learned:{}};
let S=(()=>{try{return Object.assign({},DEF,JSON.parse(localStorage.getItem('ajedrez_luciana_v2')||'{}'))}catch(e){return {...DEF}}})();
function save(){try{localStorage.setItem('ajedrez_luciana_v2',JSON.stringify(S))}catch(e){}}
function addStars(n){S.stars+=n;save();$('#nstar').textContent=S.stars}

/* ---------- voz ---------- */
let voice=null,speakTok=0,lastCancel=0,lastText='';
function pickVoice(){if(!('speechSynthesis' in window))return;const vs=speechSynthesis.getVoices();voice=vs.find(v=>/es[-_](AR|UY)/i.test(v.lang))||vs.find(v=>/es[-_](419|MX|US|CO|CL)/i.test(v.lang))||vs.find(v=>/^es/i.test(v.lang))||null}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function hush(){speakTok++;lastCancel=performance.now();try{speechSynthesis.cancel()}catch(e){}}
function say(text,rate=.85){
  return new Promise(res=>{
    const clean=text.replace(/[\p{Extended_Pictographic}️‍]/gu,'').replace(/\s+/g,' ').trim();
    let done=false;const fin=()=>{if(!done){done=true;res()}};
    if(!clean||!('speechSynthesis' in window))return fin();
    const u=new SpeechSynthesisUtterance(clean.toLowerCase());u.lang=voice?voice.lang:'es-AR';if(voice)u.voice=voice;u.rate=rate;u.pitch=1.15;u.onend=u.onerror=fin;
    setTimeout(fin,1800+clean.length*110/rate);const tok=speakTok;
    const start=()=>{if(tok!==speakTok)return fin();try{speechSynthesis.resume();speechSynthesis.speak(u)}catch(e){fin()}};
    performance.now()-lastCancel<250?setTimeout(start,150):start();
  });
}
function lula(text,speak=true){lastText=text;$('#bubble').textContent=text;if(speak){hush();return say(text)}return Promise.resolve()}
$('#owl').onclick=()=>{if(lastText){hush();say(lastText)}};

/* ---------- sonidos ---------- */
let AC=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d=.15,type='sine',vol=.16,when=0){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+when;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.05)}
const sfx={tap:()=>tone(660,.07,'triangle',.1),move:()=>tone(420,.08,'triangle',.14),cap:()=>{tone(220,.1,'square',.08);tone(660,.15,'triangle',.12,.08)},
  ok:()=>{tone(784,.12);tone(988,.12,'sine',.16,.1);tone(1319,.3,'sine',.16,.2)},no:()=>{tone(320,.14,'triangle',.14);tone(250,.2,'triangle',.14,.12)},win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.25,'triangle',.14,i*.13))};
function confetti(n=20){for(let i=0;i<n;i++){const s=document.createElement('span');s.className='confetti';s.textContent=pick(['⭐','🎉','✨','💖','♟️']);s.style.left=Math.random()*100+'vw';s.style.animationDelay=Math.random()*.4+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),2200)}}

/* ---------- piezas y sus letras ---------- */
const PN={
 p:{n:'peón',a:'el peón',L:'P',how:'Camina derecho para adelante y captura en diagonal.'},
 r:{n:'torre',a:'la torre',L:'T',how:'Va derecho: para arriba, abajo y a los costados.'},
 b:{n:'alfil',a:'el alfil',L:'A',how:'Va siempre en diagonal.'},
 n:{n:'caballo',a:'el caballo',L:'C',how:'Salta haciendo una letra L.'},
 q:{n:'reina',a:'la reina',L:'R',how:'Va derecho y en diagonal. ¡Es la más fuerte!'},
 k:{n:'rey',a:'el rey',L:'R',how:'Camina un solo pasito. ¡Hay que cuidarlo!'}
};
const LSAY={P:'pe',T:'te',A:'a',C:'ce',R:'erre'};
const WORDS={
 P:[['PATO','🦆'],['PERA','🍐'],['PAN','🥖'],['PELOTA','⚽'],['PIÑA','🍍'],['PERRO','🐶'],['PAYASO','🤡'],['PEZ','🐟'],['PIE','🦶'],['PINGÜINO','🐧'],['PIZZA','🍕'],['PAPA','🥔'],['PARAGUAS','☂️'],['PAJARITO','🐦'],['PANDA','🐼'],['PULPO','🐙'],['PINCEL','🖌️'],['PUERTA','🚪']],
 T:[['TOMATE','🍅'],['TORTUGA','🐢'],['TAZA','☕'],['TREN','🚂'],['TIGRE','🐯'],['TAMBOR','🥁'],['TELÉFONO','📞'],['TIJERA','✂️'],['TORTA','🎂'],['TOALLA','🧺'],['TELE','📺'],['TIBURÓN','🦈'],['TRACTOR','🚜'],['TROMPETA','🎺']],
 A:[['ABEJA','🐝'],['AUTO','🚗'],['AVIÓN','✈️'],['ÁRBOL','🌳'],['ARAÑA','🕷️'],['ANILLO','💍'],['AGUA','💧'],['ARCOÍRIS','🌈'],['AJO','🧄'],['ANCLA','⚓'],['ARDILLA','🐿️'],['AMBULANCIA','🚑'],['ÁGUILA','🦅'],['AGUACATE','🥑']],
 C:[['CASA','🏠'],['CAMA','🛏️'],['COCO','🥥'],['CONEJO','🐰'],['CARACOL','🐌'],['CAMELLO','🐫'],['COHETE','🚀'],['CUCHARA','🥄'],['CORONA','👑'],['COCODRILO','🐊'],['CAMISA','👔'],['CARTA','✉️'],['CORAZÓN','❤️'],['CAMIÓN','🚚'],['CANGREJO','🦀'],['CASTILLO','🏰']],
 R:[['RATÓN','🐭'],['ROSA','🌹'],['RANA','🐸'],['RELOJ','⏰'],['REGALO','🎁'],['RAYO','⚡'],['ROBOT','🤖'],['RUEDA','🛞'],['RINOCERONTE','🦏'],['RADIO','📻'],['REMO','🚣'],['ROCA','🪨'],['REGLA','📏'],['RISA','😄']]
};
const Q={};function nextOf(k,arr){if(!Q[k]||!Q[k].length)Q[k]=shuffle(arr);return Q[k].pop()}
/* Palabra con su primera letra resaltada */
const wHtml=w=>`<b>${[...w][0]}</b>${[...w].slice(1).join('')}`;
const chip=([w,e])=>`<button class="wc" data-w="${w}"><span class="e">${e}</span><span>${wHtml(w)}</span></button>`;
const BODY={
 p:'<circle cx="50" cy="34" r="19"/><path d="M36 80c1-16 7-24 9-30h10c2 6 8 14 9 30z"/>',
 r:'<path d="M26 16h11v9h7v-9h12v9h7v-9h11v22l-9 7v25l7 10H28l7-10V45l-9-7z"/>',
 b:'<circle cx="50" cy="11" r="6"/><path d="M50 15c13 9 19 21 19 30 0 9-8 14-19 14s-19-5-19-14c0-9 6-21 19-30z"/><path d="M40 58h20l7 22H33z"/>',
 n:'<path d="M30 80c0-15 7-22 17-30-7 2-13 6-17 11l-10-9c6-15 15-26 29-32l3-10 8 11c12 8 18 24 18 40 0 7-1 13-3 19z"/>',
 q:'<path d="M16 26l15 21 8-30 11 28 11-28 8 30 15-21-8 40H24z"/><circle cx="16" cy="24" r="6"/><circle cx="39" cy="15" r="6"/><circle cx="61" cy="15" r="6"/><circle cx="84" cy="24" r="6"/><path d="M32 64h36l5 16H27z"/>',
 k:'<path d="M45 4h10v9h9v10h-9v9H45v-9h-9V13h9z"/><path d="M26 34c10-7 38-7 48 0l-8 32H34z"/><path d="M33 64h34l6 16H27z"/>'
};
const FACE={p:[43,57,33,41],r:[42,58,34,44],b:[42,58,40,50],n:[0,62,34,0],q:[42,58,50,60],k:[42,58,46,56]};
function pcSvg(t,side='w',cls='',badge=true){
  const fill=side==='w'?'#FFD3E6':'#5B4B8A',st=side==='w'?'#C2307A':'#2C2350',eye=side==='w'?'#2C2350':'#fff',[x1,x2,ey,my]=FACE[t];
  const face=(x1?`<circle cx="${x1}" cy="${ey}" r="3.6" fill="${eye}"/>`:'')+`<circle cx="${x2}" cy="${ey}" r="3.6" fill="${eye}"/>`+(my?`<path d="M${(x1+x2)/2-6} ${my}q6 5 12 0" stroke="${eye}" stroke-width="2.6" fill="none" stroke-linecap="round"/>`:'');
  const tag=badge?`<circle cx="80" cy="78" r="19" fill="#fff" stroke="${st}" stroke-width="3"/><text x="80" y="87" text-anchor="middle" font-size="27" font-weight="700" font-family="Andika,sans-serif" fill="${st}">${PN[t].L}</text>`:'';
  return `<svg class="${cls}" viewBox="0 0 100 100" aria-hidden="true"><g fill="${fill}" stroke="${st}" stroke-width="3.4" stroke-linejoin="round">${BODY[t]}<rect x="20" y="80" width="60" height="13" rx="6"/></g>${face}${tag}</svg>`;
}

/* ---------- panel: la letra de la pieza + ideas de palabras ---------- */
function showIdeas(t,speak){
  const P=PN[t],ideas=shuffle(WORDS[P.L]).slice(0,4);
  $('#info').innerHTML=`<div class="ofl"><span class="L">${P.L}</span> de <span class="w">${P.n.toUpperCase()}</span></div><div class="hintline">${P.how}</div><div class="ideas">${ideas.map(chip).join('')}</div>`;
  if(speak){const ej=ideas.slice(0,2).map(i=>i[0]).join(', ');lula(`${LSAY[P.L]} de ${P.n}. ${P.how} Con ${LSAY[P.L]} también empieza ${ej}.`)}
}
/* Para mover una pieza primero hay que decir otra palabra con su letra */
let okL=new Set(),asking=null;
function reveal(P,hint){
  sel=P;asking=null;clearMarks();sqEl(P.x,P.y).classList.add('sel');
  for(const[a,b]of moves(B,P.x,P.y))sqEl(a,b).innerHTML=B[b][a]?'<i class="cap"></i>':'<i></i>';
  if(hint)sqEl(hint.x2,hint.y2).classList.add('help');
}
function askWord(P,hint){
  const I=PN[P.t],L=I.L,good=nextOf('w'+L,WORDS[L]);
  const others=shuffle(Object.keys(WORDS).filter(x=>x!==L)).slice(0,2).map(x=>pick(WORDS[x]));
  sel=null;asking=P;clearMarks();sqEl(P.x,P.y).classList.add('sel');
  $('#info').innerHTML=`<div class="ofl"><span class="L">${L}</span> de <span class="w">${I.n.toUpperCase()}</span></div><div class="ask">¿Qué otra palabra empieza con ${L}?</div>
    <div class="qrows">${shuffle([good,...others]).map(([w,e])=>`<button class="qopt" data-w="${w}"><span class="e">${e}</span><span>${wHtml(w)}</span></button>`).join('')}</div>`;
  lula(`${LSAY[L]} de ${I.n}. ¿Qué otra palabra empieza con ${LSAY[L]}?`);
  let miss=0;
  $$('.qopt').forEach(b=>b.onclick=()=>{
    const w=b.dataset.w;
    if(w!==good[0]){miss++;sfx.no();b.classList.remove('no');void b.offsetWidth;b.classList.add('no');lula(`${w} empieza con ${LSAY[w.normalize('NFD')[0]]}. Buscá una con ${LSAY[L]}.`);return}
    sfx.ok();addStars(1);confetti(8);learn(w);okL.add(L);reveal(P,hint);
    const more=shuffle(WORDS[L].filter(x=>x[0]!==w)).slice(0,3);
    $('#info').innerHTML=`<div class="reward"><span class="pic">${good[1]}</span><div><div class="bigw">${wHtml(w)}</div><div class="hintline">empieza con ${L}, como ${I.n.toUpperCase()}</div></div></div><div class="ideas">${more.map(chip).join('')}</div>`;
    lula(`¡Sí! ${w} empieza con ${LSAY[L]}, como ${I.n}. ${hint?'Mirá el cuadrado verde.':`Ahora mové ${I.a}.`}`);
  });
}
function showTurn(msg){$('#info').innerHTML=`<div class="ofl" style="margin-top:6px">${msg}</div><div class="hintline">Tocá una pieza rosada y decí otra palabra con su letra para moverla.</div>`}
function learn(w){S.learned[w]=1;save()}
document.addEventListener('click',e=>{
  const c=e.target.closest('.wc');if(c){sfx.tap();learn(c.dataset.w);hush();say(c.dataset.w);return}
  const b=e.target.closest('.btn');if(b&&b.id!=='startBtn'){hush();say(b.getAttribute('aria-label')||b.textContent.replace(/[▶⬅️✓]/g,''))}
},true);

/* ---------- movimientos: ajedrez real, sin enroque ni captura al paso ---------- */
const n=8;
const DIRS={r:[[1,0],[-1,0],[0,1],[0,-1]],b:[[1,1],[1,-1],[-1,1],[-1,-1]]};DIRS.q=[...DIRS.r,...DIRS.b];DIRS.k=DIRS.q;
const JUMP=[[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]];
const inb=(a,b)=>a>=0&&b>=0&&a<n&&b<n;
function moves(B,x,y){
  const P=B[y][x],out=[],side=P.c;
  if(P.t==='p'){const d=side==='w'?-1:1,home=side==='w'?6:1;
    if(inb(x,y+d)&&!B[y+d][x]){out.push([x,y+d]);if(y===home&&!B[y+2*d][x])out.push([x,y+2*d])}
    for(const dx of[-1,1]){const q=inb(x+dx,y+d)&&B[y+d][x+dx];if(q&&q.c!==side)out.push([x+dx,y+d])}return out}
  if(P.t==='n'){for(const[dx,dy]of JUMP)if(inb(x+dx,y+dy)){const q=B[y+dy][x+dx];if(!q||q.c!==side)out.push([x+dx,y+dy])}return out}
  for(const[dx,dy]of DIRS[P.t]){let a=x+dx,b=y+dy;while(inb(a,b)){const q=B[b][a];if(q){if(q.c!==side)out.push([a,b]);break}out.push([a,b]);if(P.t==='k')break;a+=dx;b+=dy}}
  return out;
}

/* ---------- tarjeta: palabras con la letra de la pieza ---------- */
function wordCard(t,title){
  return new Promise(res=>{
    const P=PN[t],L=P.L,good=nextOf('w'+L,WORDS[L]);
    const others=shuffle(Object.keys(WORDS).filter(x=>x!==L)).slice(0,2).map(x=>pick(WORDS[x]));
    const opts=shuffle([good,...others]);
    const ov=document.createElement('div');ov.className='ov';ov.id='ovl';
    ov.innerHTML=`<div class="box">${pcSvg(t,'w','pcbig',false)}<h2>${title}</h2><div class="bigL">${L}</div><div class="ofl">${L} de ${P.n.toUpperCase()}</div>
      <div class="hintline" style="font-size:18px">¿Cuál empieza con ${L}?</div>
      <div class="opts">${opts.map(([w,e])=>`<button class="opt" data-w="${w}"><span class="e">${e}</span><span class="w">${wHtml(w)}</span></button>`).join('')}</div><div id="more"></div></div>`;
    document.body.appendChild(ov);
    lula(`${LSAY[L]} de ${P.n}. ¿Cuál empieza con ${LSAY[L]}?`);
    let miss=0,done=false;
    $$('.opt',ov).forEach(b=>b.onclick=()=>{
      if(done)return;const w=b.dataset.w;
      if(w===good[0]){done=true;b.classList.add('good');sfx.ok();addStars(miss?1:2);confetti(12);learn(w);
        const more=shuffle(WORDS[L].filter(x=>x[0]!==w)).slice(0,5);
        $('#more',ov).innerHTML=`<h3>Más palabras con ${L}. ¡Tocalas!</h3><div class="ideas">${more.map(chip).join('')}</div><div class="row"><button class="btn go" id="seguir">¡Seguir jugando! ▶</button></div>`;
        $('#seguir',ov).onclick=()=>{ov.remove();res()};
        lula(`¡Sí! ${w} empieza con ${LSAY[L]}. También ${more.slice(0,2).map(x=>x[0]).join(' y ')}.`);
      }else{miss++;sfx.no();b.classList.remove('no');void b.offsetWidth;b.classList.add('no');lula(`${w} empieza con ${LSAY[w[0].normalize('NFD')[0]]}. Buscá una con ${LSAY[L]}.`)}
    });
  });
}
function showDict(start='P'){
  const ov=document.createElement('div');ov.className='ov';ov.id='dic';
  const names={P:'peón',T:'torre',A:'alfil',C:'caballo',R:'reina y rey'};
  const draw=L=>{ov.innerHTML=`<div class="box"><h2>📖 Palabras de las piezas</h2><div class="tabs">${Object.keys(WORDS).map(x=>`<button class="${x===L?'on':''}" data-l="${x}">${x}</button>`).join('')}</div>
    <div class="ofl" style="margin-top:6px"><span class="L">${L}</span> de <span class="w">${names[L].toUpperCase()}</span></div><div class="ideas">${WORDS[L].map(chip).join('')}</div><div class="row"><button class="btn go" id="cl">Volver al juego ▶</button></div></div>`;
    $$('.tabs button',ov).forEach(b=>b.onclick=()=>{sfx.tap();draw(b.dataset.l);lula(`Palabras con ${LSAY[b.dataset.l]}. Tocalas para escucharlas.`)});$('#cl',ov).onclick=()=>ov.remove()};
  draw(start);document.body.appendChild(ov);lula(`Palabras con ${LSAY[start]}. Tocalas para escucharlas.`);
}

/* ---------- partida ---------- */
const BACK=['r','n','b','q','k','b','n','r'];
let B,sel,busy,over,alive=0;
const bd=$('#bd');
const sqEl=(x,y)=>bd.querySelector(`.sq[data-x="${x}"][data-y="${y}"]`);
function clearMarks(){$$('.sq',bd).forEach(s=>{s.classList.remove('sel','help');s.innerHTML=''})}
function addPiece(p){p.el=document.createElement('div');p.el.className='pc';p.el.style.left=p.x*12.5+'%';p.el.style.top=p.y*12.5+'%';p.el.innerHTML=pcSvg(p.t,p.c);bd.appendChild(p.el);B[p.y][p.x]=p}
function storeGame(){S.game=B.flat().filter(Boolean).map(p=>[p.t,p.c,p.x,p.y]);save()}
function newGame(resume){
  alive++;sel=null;asking=null;okL.clear();busy=false;over=false;$('#ovl')?.remove();
  B=Array.from({length:n},()=>Array(n).fill(null));
  bd.innerHTML=Array.from({length:64},(_,i)=>{const x=i%8,y=i>>3;return `<button class="sq ${(x+y)%2?'d':''}" data-x="${x}" data-y="${y}" style="left:${x*12.5}%;top:${y*12.5}%"></button>`}).join('');
  let list;
  if(resume&&S.game&&S.game.length)list=S.game.map(([t,c,x,y])=>({t,c,x,y}));
  else{list=[];S.moves=0;for(let x=0;x<8;x++){list.push({t:BACK[x],c:'b',x,y:0},{t:'p',c:'b',x,y:1},{t:'p',c:'w',x,y:6},{t:BACK[x],c:'w',x,y:7})}}
  list.forEach(addPiece);storeGame();
  $('#tools').innerHTML=`<button class="btn sun" id="help" aria-label="Ayuda">💡 Ayuda</button><button class="btn" id="dict" aria-label="Palabras">📖 Palabras</button><button class="btn" id="re" aria-label="Partida nueva">🔄 Nueva</button>`;
  wireTools();showTurn('Te toca a vos 👸');
}
function allMoves(side){const out=[];for(let y=0;y<n;y++)for(let x=0;x<n;x++){const P=B[y][x];if(P&&P.c===side)for(const[a,b]of moves(B,x,y))out.push({P,x2:a,y2:b})}return out}
function doMove(P,x,y){
  const q=B[y][x];B[P.y][P.x]=null;B[y][x]=P;P.x=x;P.y=y;P.el.style.left=x*12.5+'%';P.el.style.top=y*12.5+'%';
  if(q){q.el.classList.add('gone');setTimeout(()=>q.el.remove(),300);sfx.cap()}else sfx.move();
  let promoted=false;if(P.t==='p'&&(y===0||y===n-1)){P.t='q';P.el.innerHTML=pcSvg('q',P.c);promoted=true}
  return {got:q,promoted};
}
function finish(won){
  over=true;clearMarks();S.game=null;
  if(won){S.wins++;addStars(5);sfx.win();confetti(50);$('#info').innerHTML=`<div class="bigwin">🏆</div><div class="ofl">¡Ganaste la partida!</div><div class="hintline">Ya tenés ${S.wins} ${S.wins===1?'partida ganada':'partidas ganadas'} y conocés ${Object.keys(S.learned).length} palabras.</div>`;lula('¡Ganaste la partida, Luciana! ¡Sos una campeona!')}
  else{showTurn('¡Empate!');lula('Nadie se puede mover. ¡Es un empate! Jugamos otra.')}
  save();
  $('#tools').innerHTML=`<button class="btn go" id="again" aria-label="Otra partida">Otra partida ▶</button><button class="btn" id="dict" aria-label="Palabras">📖 Palabras</button>`;
  $('#again').onclick=()=>{newGame(false);lula('¡Nueva partida! Tocá una pieza rosada.')};$('#dict').onclick=()=>showDict();
}
/* La compu juega muy distraída: casi nunca captura y jamás captura a tu rey */
async function cpu(){
  const me=alive;showTurn('Piensa la compu… 🤔');await wait(600);if(me!==alive||over)return;
  const all=allMoves('b').filter(m=>{const q=B[m.y2][m.x2];return !(q&&q.t==='k')});
  if(all.length){
    const quiet=all.filter(m=>!B[m.y2][m.x2]),caps=all.filter(m=>B[m.y2][m.x2]);
    const m=caps.length&&(!quiet.length||Math.random()<.12)?pick(caps):pick(quiet.length?quiet:caps);
    const {got}=doMove(m.P,m.x2,m.y2);await wait(320);if(me!==alive)return;
    if(got)lula(`¡Uy! Te capturó ${PN[got.t].a}.`);
    else if(allMoves('b').some(q=>{const c=B[q.y2][q.x2];return c&&c.t==='k'}))lula('¡Cuidado! Están mirando a tu rey.');
    else lula('Te toca a vos.',false);
  }
  storeGame();
  if(!allMoves('w').length)return finish(false);
  showTurn('Te toca a vos 👸');busy=false;
}
async function tap(x,y){
  if(busy||over)return;const P=B[y][x];
  if(sel&&moves(B,sel.x,sel.y).some(([a,b])=>a===x&&b===y)){
    const me=sel,tk=alive;sel=null;okL.clear();clearMarks();busy=true;S.moves++;
    const {got,promoted}=doMove(me,x,y);await wait(320);if(tk!==alive)return;
    const won=got&&got.t==='k';
    if(promoted)await lula('¡Tu peón llegó al final y se convirtió en reina!');
    if(tk!==alive)return;
    if(got)await wordCard(got.t,`¡Capturaste ${PN[got.t].a}!`);
    if(tk!==alive)return;
    if(won)return finish(true);
    storeGame();return cpu();
  }
  if(P&&P.c==='w'){sfx.tap();
    if(!moves(B,x,y).length){sel=null;asking=null;clearMarks();sqEl(x,y).classList.add('sel');showIdeas(P.t,false);$('#info .hintline').textContent='Ahora no se puede mover: probá con otra pieza.';lula(`${PN[P.t].a} ahora no se puede mover. Probá con otra pieza.`);return}
    if(okL.has(PN[P.t].L)){reveal(P);showIdeas(P.t,true)}else askWord(P);return}
  if(P){sfx.tap();showIdeas(P.t,false);lula(`Ese es ${PN[P.t].a} de la compu. ${LSAY[PN[P.t].L]} de ${PN[P.t].n}. ¡Capturalo!`);return}
  if(asking){sfx.no();lula(`Primero elegí una palabra que empiece con ${LSAY[PN[asking.t].L]}.`);return}
  if(sel){sfx.no();lula(`${PN[sel.t].a} no puede ir ahí. Andá a un puntito verde.`);return}
  lula('Primero tocá una de tus piezas rosadas.');
}
bd.onclick=e=>{const s=e.target.closest('.sq');if(s)tap(+s.dataset.x,+s.dataset.y)};
function wireTools(){
  $('#help').onclick=()=>{if(busy||over)return;const all=allMoves('w');if(!all.length)return;
    const score=m=>{const q=B[m.y2][m.x2];return q?(q.t==='k'?1000:{q:50,r:30,b:20,n:20,p:10}[q.t]):(m.P.t==='p'?2:1)+Math.random()*2};
    const best=all.reduce((a,c)=>score(c)>score(a)?c:a);
    if(!okL.has(PN[best.P.t].L)){askWord(best.P,best);return}
    reveal(best.P,best);showIdeas(best.P.t,false);lula(`Probá con ${PN[best.P.t].a}: mirá el cuadrado verde.`)};
  $('#dict').onclick=()=>showDict(sel?PN[sel.t].L:'P');
  const re=$('#re');re.onclick=()=>{if(!re.classList.contains('armed')){re.classList.add('armed');lula('¿Empezamos otra partida? Tocá otra vez.');setTimeout(()=>re.classList.remove('armed'),4000);return}newGame(false);lula('¡Partida nueva! Tocá una pieza rosada.')};
}

/* ---------- que todo entre en la pantalla ---------- */
const LAND=matchMedia('(orientation:landscape) and (max-height:560px)');
function trimPanel(){const I=$('#info');if(I.classList.contains('asking'))return;const c=[...I.querySelectorAll('.wc')];while(c.length&&I.scrollHeight>I.clientHeight+1)c.pop().remove()}
function fit(){
  const app=$('.app'),cs=getComputedStyle(app),H=app.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom),W=app.clientWidth;
  const rest=$('.top').offsetHeight+$('#tools').offsetHeight+$('.lula').offsetHeight+6*3+6+92;
  const bs=Math.max(180,Math.floor(LAND.matches?Math.min(H,W*.55):Math.min(W,H-rest)));
  app.style.setProperty('--bs',bs+'px');
  app.style.setProperty('--sheet',(LAND.matches?H:H-$('.top').offsetHeight-bs-12)+'px');
  trimPanel();
}
new MutationObserver(()=>{$('#info').classList.toggle('asking',!!$('#info .qrows'));trimPanel()}).observe($('#info'),{childList:true});
addEventListener('resize',fit);addEventListener('orientationchange',fit);fit();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);

/* ---------- arranque ---------- */
$('#nstar').textContent=S.stars;
const hadGame=!!(S.game&&S.game.length);newGame(true);
$('#startBtn').onclick=()=>{ac();sfx.win();pickVoice();$('#start').remove();lula(hadGame?'¡Seguimos con tu partida! Tocá una pieza rosada.':'¡Hola Luciana! Tus piezas son las rosadas. Cada una tiene su letra: P de peón, T de torre. Tocá una para empezar.')};
</script>
