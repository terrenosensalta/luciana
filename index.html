<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Luciana Exploradora</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: una columna tipo "mochila": barra arriba, escenario al centro, Lula (la lechuza) abajo */
:root{
  --sky:#E4F2FF; --sky-dot:#D3E8FB; --paper:#FFFFFF; --ink:#17304D; --muted:#5A7290; --line:#CFE0F1;
  --vow:#E5405E; --con:#2563EB; --leaf:#2E9E58; --sun:#FFB21E; --grape:#7C4DDB; --clay:#F2733B; --ok:#16A34A;
  --soft:#F3F8FE; --shadow:rgba(23,48,77,.12);
  --f-ui:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-read:"Andika","Century Gothic","Trebuchet MS",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
.daycard .big small{font-size:.6em}
html{background:var(--sky)}
body{
  background:var(--sky) radial-gradient(var(--sky-dot) 18%,transparent 19%) 0 0/26px 26px;
  color:var(--ink);font-family:var(--f-ui);font-weight:700;font-size:18px;line-height:1.35;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  user-select:none;-webkit-user-select:none;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sky)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:4px solid var(--sun);outline-offset:2px}
.app{max-width:780px;margin:0 auto;padding-block:8px 150px}
.v{color:var(--vow)} .c{color:var(--con)}
.read{font-family:var(--f-read)}

/* Barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:8px;padding-block:8px;background:var(--sky)}
.ttl{flex:1;min-width:0;font-size:clamp(20px,5vw,28px);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:52px;height:52px;flex:none;border-radius:16px;background:var(--paper);border:3px solid var(--line);border-bottom-width:6px;font-size:26px;display:grid;place-items:center}
.pill{flex:none;display:flex;align-items:center;gap:4px;padding:4px 12px;border-radius:999px;background:var(--paper);border:3px solid #FFE08A;border-bottom-width:5px;font-size:20px;font-weight:800;color:#A45A00}
.pill.stk{border-color:#E3D3FF;color:#5B2DB8}
.pill.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.25)}}

/* Botones gorditos */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:6px 18px;border-radius:20px;background:var(--paper);border:3px solid var(--line);border-bottom-width:7px;font-size:20px;font-weight:800;transition:transform .08s}
.btn:active,.iconbtn:active,.tile:active,.opt:active,.chip:active{transform:translateY(3px)}
.btn.go{background:var(--leaf);border-color:#23804A;color:#fff}
.btn.sun{background:#FFF4D6;border-color:var(--sun)}
.btn.blue{background:#E6F0FF;border-color:#9CC0F7}
.btn.on{background:#FFF0B8;border-color:var(--sun)}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.panel{background:var(--paper);border:3px solid var(--line);border-radius:28px;padding:16px;box-shadow:0 6px 0 var(--shadow)}
.center{text-align:center}
.hint{color:var(--muted);font-size:16px;font-weight:700;text-align:center;margin:8px 0 0}

/* Inicio */
.hello{display:flex;gap:12px;align-items:stretch;margin:6px 0 18px}
.hello .hi{flex:1;min-width:0;background:var(--paper);border-radius:28px;padding:14px 18px;border:3px solid var(--line)}
.hello h1{margin:0;font-family:var(--f-read);font-size:clamp(30px,8vw,46px);line-height:1.05;text-wrap:balance}
.hello p{margin:4px 0 0;color:var(--muted);font-size:18px}
.daycard{flex:none;width:clamp(110px,28vw,150px);border-radius:28px;background:#FFF4D6;border:3px solid var(--sun);border-bottom-width:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px}
.daycard small{font-size:14px;color:#A45A00;letter-spacing:.04em;text-transform:uppercase}
.daycard .big{font-family:var(--f-read);font-size:clamp(46px,12vw,64px);line-height:1}
.daycard .em{font-size:28px}
.zone{margin:0 0 20px}
.zone h2{display:flex;align-items:center;gap:8px;font-size:clamp(20px,5vw,26px);margin:0 0 10px;font-weight:800}
.zone h2 i{font-style:normal;width:14px;height:14px;border-radius:50%;background:var(--z)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{position:relative;border-radius:24px;background:var(--paper);border:3px solid var(--line);border-bottom:7px solid var(--z);padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:112px;justify-content:center}
.tile .em{font-size:clamp(34px,9vw,46px);line-height:1.1}
.tile b{font-size:clamp(15px,3.8vw,19px);font-weight:800;text-align:center;line-height:1.1}
.tile .cnt{position:absolute;top:6px;right:8px;font-size:13px;color:#A45A00}
.tile.armed,.whycard.armed,.whybanner.armed,.daycard.armed{outline:5px solid var(--sun);outline-offset:3px;animation:bump .4s}
.tile.armed::before,.whycard.armed::before{content:"👆 ¡otra vez!";position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--sun);color:var(--ink);font-size:13px;border-radius:999px;padding:0 8px;z-index:1}
.whybanner,.daycard{position:relative}
.z-let{--z:var(--con)} .z-nat{--z:var(--leaf)} .z-fis{--z:var(--grape)} .z-num{--z:var(--clay)}
.whybanner{width:100%;display:flex;align-items:center;gap:14px;border-radius:28px;padding:14px 18px;margin:0 0 20px;background:#FFF4D6;border:3px solid var(--sun);border-bottom-width:8px;text-align:left}
.whybanner .q{font-size:clamp(54px,14vw,72px);line-height:1;font-family:var(--f-read);color:var(--clay)}
.whybanner b{display:block;font-size:clamp(24px,6vw,32px);line-height:1.05}
.whybanner span{color:var(--muted);font-size:16px}
.whybanner.pzb{background:#FFEAF4;border-color:#FF7EB6}
.whybanner.pzb .q{font-family:inherit}

/* Rompecabezas */
.scenes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.scene{position:relative;padding:0;border-radius:20px;overflow:hidden;border:3px solid var(--line);border-bottom-width:7px;background:var(--paper)}
.scene img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.scene b{display:block;padding:4px 6px 6px;font-size:16px;line-height:1.1}
.scene .ok{position:absolute;top:6px;right:8px;background:#fff;border-radius:999px;padding:0 8px;font-size:14px;color:#A45A00}
.pzboard{position:relative;display:grid;margin:12px auto 0;border-radius:16px;overflow:hidden;border:4px solid #FF7EB6;background:#fff}
.pzslot{position:relative;box-shadow:inset 0 0 0 1px rgba(255,126,182,.45)}
.pzslot::before{content:"";position:absolute;inset:0;background:var(--img);background-size:var(--bs);background-position:var(--bp);opacity:.18}
.pzslot.hl{box-shadow:inset 0 0 0 4px var(--sun)}
.pztray{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px;min-height:60px}
.pzp{flex:none;border-radius:8px;background-repeat:no-repeat;box-shadow:0 3px 0 var(--shadow),0 0 0 2px #fff;touch-action:none;cursor:grab}
.pzp.sel{outline:4px solid var(--sun);outline-offset:2px}
.pzp.drag{position:fixed;z-index:15;pointer-events:none;transform:scale(1.08);box-shadow:0 10px 20px rgba(0,0,0,.25)}
.pzslot .pzp{position:absolute;inset:0;width:100%!important;height:100%!important;border-radius:0;box-shadow:none;cursor:default}
.pzboard.done .pzslot{box-shadow:none}
.parents{display:flex;justify-content:center;margin-top:8px}
.parents button{position:relative;overflow:hidden;background:transparent;border:2px dashed var(--line);border-radius:999px;padding:8px 18px;color:var(--muted);font-size:15px}
.parents button i{position:absolute;inset:0;width:0;background:rgba(124,77,219,.18)}

/* Lula */
.lula{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.lula .in{max-width:780px;margin:0 auto;display:flex;align-items:flex-end;gap:10px}
.owl{pointer-events:auto;flex:none;width:76px;height:76px;border-radius:50%;background:#FFF4D6;border:4px solid var(--sun);font-size:46px;display:grid;place-items:center;box-shadow:0 5px 0 var(--shadow)}
.owl.talk{animation:talk .5s infinite alternate}
@keyframes talk{to{transform:rotate(-6deg) scale(1.05)}}
.bubble{pointer-events:auto;flex:1;min-width:0;background:var(--paper);border:3px solid var(--line);border-radius:22px 22px 22px 6px;padding:10px 14px;font-size:clamp(16px,4.2vw,20px);box-shadow:0 5px 0 var(--shadow);max-height:30vh;overflow:auto}
.bubble.pop{animation:bub .3s}
@keyframes bub{from{transform:scale(.92);opacity:.4}}

/* Abecedario */
.lettercard{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;align-items:center}
.lettercard .big{font-family:var(--f-read);font-size:clamp(84px,24vw,130px);line-height:.95}
.lettercard .big small{font-size:.6em}
.lettercard .ex{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.lettercard .ex .em{font-size:clamp(54px,14vw,74px);line-height:1}
.lettercard .ex .w{font-family:var(--f-read);font-size:clamp(28px,7vw,40px)}
.lettercard .ex .w .first{text-decoration:underline;text-decoration-thickness:5px;text-underline-offset:6px}
.lettercard .btns{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.abcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;margin-top:14px}
.lt{aspect-ratio:1;border-radius:18px;background:var(--paper);border:3px solid var(--line);border-bottom-width:6px;font-family:var(--f-read);font-size:clamp(30px,8vw,40px);display:grid;place-items:center;position:relative}
.lt.seen::after{content:"";position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:var(--leaf)}
.lt.now{background:#FFF0B8;border-color:var(--sun);transform:scale(1.1)}
.seg{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0 0}
.opts{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:14px}
.opt{min-width:96px;min-height:96px;padding:8px 12px;border-radius:24px;background:var(--paper);border:3px solid var(--line);border-bottom-width:7px;font-family:var(--f-read);font-size:clamp(40px,11vw,56px);display:grid;place-items:center;line-height:1}
.opt.em{font-family:inherit}
.opt,.slot,.lt{grid-auto-flow:column}
.opt.good{background:#DFF7E6;border-color:var(--ok)}
.qtitle{font-size:clamp(22px,5.5vw,30px);margin:0;text-align:center;font-weight:800;text-wrap:balance}

/* Trazar */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:thin}
.chip{flex:none;min-width:52px;height:52px;padding:0 12px;border-radius:16px;background:var(--paper);border:3px solid var(--line);border-bottom-width:5px;font-family:var(--f-read);font-size:28px}
.chip.on{background:#FFF0B8;border-color:var(--sun)}
.chip.name{font-family:var(--f-ui);font-size:18px;font-weight:800;color:var(--grape)}
.tracewrap{position:relative;background:var(--paper);border:3px solid var(--line);border-radius:28px;overflow:hidden;
  background-image:linear-gradient(transparent calc(50% - 1px),#F7C9D3 calc(50% - 1px),#F7C9D3 calc(50% + 1px),transparent calc(50% + 1px)),repeating-linear-gradient(transparent 0 37px,#E3EEF9 37px 39px)}
.tracewrap canvas{display:block;width:100%;touch-action:none}
.tracetag{position:absolute;left:12px;top:10px;font-size:20px;color:var(--muted);pointer-events:none}
.nameprog{display:flex;justify-content:center;gap:6px;font-family:var(--f-read);font-size:34px;margin-bottom:8px}
.nameprog span{opacity:.3}
.nameprog span.done{opacity:1}
.nameprog span.cur{opacity:1;text-decoration:underline;text-decoration-thickness:4px}

/* Sílabas / palabras */
.wordpic{font-size:clamp(84px,24vw,120px);line-height:1;text-align:center}
.slots{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:12px 0}
.slot{min-width:84px;height:84px;padding:0 10px;border-radius:20px;border:4px dashed var(--line);display:grid;place-items:center;font-family:var(--f-read);font-size:clamp(34px,9vw,46px);background:var(--soft)}
.slot.small{min-width:56px;height:70px;font-size:clamp(30px,8vw,40px)}
.slot.full{border-style:solid;border-color:var(--ok);background:#EFFAF2}
.slot.lit{background:#FFF0B8;border-color:var(--sun)}
.pool{display:flex;justify-content:center;flex-wrap:wrap;gap:10px}
.pool .opt{min-width:84px;min-height:84px;font-size:clamp(32px,9vw,44px)}
.pool .opt.used{visibility:hidden}
.bigword{font-family:var(--f-read);font-size:clamp(52px,15vw,84px);text-align:center;line-height:1.1;display:flex;justify-content:center;flex-wrap:wrap;gap:2px}
.bigword .sy{border-radius:14px;padding:0 4px;cursor:pointer}
.bigword .sy.lit{background:#FFF0B8}

/* Naturaleza */
.cycleslots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.cs{position:relative;aspect-ratio:1;border-radius:20px;border:4px dashed var(--line);background:var(--soft);display:grid;place-items:center;font-size:clamp(40px,11vw,60px)}
.cs .n{position:absolute;top:4px;left:8px;font-size:15px;color:var(--muted)}
.cs.full{border-style:solid;border-color:var(--leaf);background:#EFFAF2}
.cs small{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-size:13px;color:var(--muted)}
.esvg{width:1em;height:1em}
.baskets{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.basket{border-radius:28px;padding:14px 8px;border:3px solid var(--line);border-bottom-width:8px;background:var(--paper);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:22px;font-weight:800}
.basket .em{font-size:52px;line-height:1}
.basket.yes{border-color:var(--leaf);background:#EFFAF2}
.basket.no{border-color:#B8C3D1;background:#F4F6F9}
.basket .got{font-size:24px;min-height:30px;letter-spacing:2px}
.plantbox{display:grid;place-items:center}
.plantbox svg{width:min(100%,340px);height:auto}
.meters{display:flex;justify-content:center;gap:18px;font-size:18px;color:var(--muted);margin-top:4px}
.meters b{font-size:24px}
.drop{position:fixed;font-size:34px;pointer-events:none;z-index:7;animation:fall 1s ease-in forwards}
@keyframes fall{to{transform:translateY(160px);opacity:0}}

/* Física */
.labwrap{border-radius:28px;overflow:hidden;border:3px solid var(--line);background:#8FD3FF}
.labwrap canvas{display:block;width:100%}
.labinfo{margin:8px 0 0;text-align:center;color:var(--muted);font-size:16px}
.objs{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:10px}
.obj{border-radius:18px;background:var(--paper);border:3px solid var(--line);border-bottom-width:6px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;line-height:1.05}
.obj span{font-size:clamp(28px,8vw,40px)}
.obj small{font-size:clamp(11px,3vw,14px);font-weight:800}
.tank{position:relative;height:320px;border-radius:28px;overflow:hidden;border:3px solid var(--line);background:linear-gradient(#F3F8FE 0 42%,transparent 42%)}
.tank .water{position:absolute;left:0;right:0;top:42%;bottom:0;background:linear-gradient(#7CC6FF,#3B8FE0)}
.tank .water::before{content:"";position:absolute;left:0;right:0;top:-6px;height:12px;background:radial-gradient(circle at 10px -2px,transparent 9px,#7CC6FF 10px) 0 0/22px 12px repeat-x}
.fo{position:absolute;left:50%;top:6%;transform:translateX(-50%);font-size:64px;line-height:1;transition:top 1.1s cubic-bezier(.5,0,.6,1)}
.fo.sink{transition:top 2.2s cubic-bezier(.4,.1,.5,1)}
.fo.bob{animation:bobbing 1.6s ease-in-out infinite}
@keyframes bobbing{50%{margin-top:8px}}
.fname{text-align:center;font-family:var(--f-read);font-size:30px;margin-top:6px}
.magzone{position:relative;display:flex;flex-direction:column;align-items:center}
.magnet{font-size:90px;line-height:1;transform:rotate(180deg)}
.stuck{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;min-height:48px;font-size:40px}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:10px;margin-top:12px}
.items .opt{font-family:var(--f-ui);font-size:44px;min-width:0;width:100%}
.items .opt.done{opacity:.25}
.flyer{position:fixed;z-index:8;font-size:44px;pointer-events:none;transition:transform .7s cubic-bezier(.6,-.2,.7,1.2)}
.sunbox svg{display:block;width:100%;height:auto;border-radius:28px;border:3px solid var(--line)}
.slider{width:100%;margin-top:12px;accent-color:var(--sun);height:48px;-webkit-appearance:none;appearance:none;background:transparent}
.slider::-webkit-slider-runnable-track{height:14px;border-radius:999px;background:linear-gradient(90deg,#FF9E6B,#8FD3FF 40%,#8FD3FF 60%,#FF9E6B 80%,#0E1A3A)}
.slider::-moz-range-track{height:14px;border-radius:999px;background:linear-gradient(90deg,#FF9E6B,#8FD3FF 40%,#8FD3FF 60%,#FF9E6B 80%,#0E1A3A)}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:44px;height:44px;margin-top:-15px;border-radius:50%;background:var(--sun);border:4px solid #fff;box-shadow:0 3px 0 var(--shadow)}
.slider::-moz-range-thumb{width:38px;height:38px;border-radius:50%;background:var(--sun);border:4px solid #fff}
.clock{text-align:center;font-size:22px;margin-top:4px}
.pots{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pot{border-radius:24px;border:3px solid var(--line);border-bottom-width:7px;background:var(--paper);padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:16px}
.pot i{width:54px;height:54px;border-radius:50%;border:3px solid rgba(0,0,0,.12);display:block}
.pot.on{border-color:var(--ink)}
.bowl{width:min(220px,60vw);aspect-ratio:1;margin:16px auto 6px;border-radius:50%;border:10px solid #E8EEF5;background:var(--soft);display:grid;place-items:center;padding:24px;font-size:18px;color:var(--muted);text-align:center;transition:background .6s}
.bowl.swirl{animation:spin 1s linear}
@keyframes spin{to{transform:rotate(360deg)}}
.found{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.found span{display:flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;background:var(--paper);border:2px solid var(--line);font-size:16px}
.found span i{width:18px;height:18px;border-radius:50%;display:inline-block}
.found span.no{opacity:.4}

/* Números */
.numgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:14px}
.nm{aspect-ratio:1;padding:0;border-radius:10px;background:var(--paper);border:2px solid var(--line);border-bottom-width:4px;font-family:var(--f-read);font-size:clamp(13px,3.9vw,24px);display:grid;place-items:center}
.nm.ten{background:#FFE7D9;border-color:var(--clay);color:#B4471A}
.nm.now{background:#FFF0B8;border-color:var(--sun);transform:scale(1.18)}
.tens{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
.tens .nm{aspect-ratio:auto;min-height:60px;font-size:clamp(24px,6.5vw,34px);border-width:3px;border-bottom-width:6px}
.numcard{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:center}
.numcard .big{font-family:var(--f-read);font-size:clamp(80px,22vw,120px);line-height:.95}
.numcard .big .d{color:var(--clay)} .numcard .big .u{color:var(--con)}
.numcard .word{font-family:var(--f-read);font-size:clamp(24px,6vw,34px);line-height:1.1}
.numcard .dec{color:var(--muted);font-size:17px}
.numcard .btns{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}

<script>
/* ---------- utilidades ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.random()*a.length|0];
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const VOW=new Set([...'aeiouáéíóúAEIOUÁÉÍÓÚ']);
const fmt=t=>S.upper?t.toUpperCase():t.toLowerCase();
const cw=t=>[...fmt(t)].map(ch=>ch===' '?' ':`<span class="${VOW.has(ch)?'v':'c'}">${ch}</span>`).join('');
const strip=t=>t.replace(/[\p{Extended_Pictographic}️‍]/gu,'').replace(/\s+/g,' ').trim();

/* ---------- datos guardados ---------- */
const DEF={stars:0,stickers:[],seen:{},traced:{},done:{},whys:{},grav:{},mixes:{},zones:{},mags:{},flots:{},pz:{},upper:true,rate:.85,voice:''};
let S=(()=>{try{return Object.assign({},DEF,JSON.parse(localStorage.getItem('luciana_v3')||'{}'))}catch(e){return {...DEF}}})();
function save(){try{localStorage.setItem('luciana_v3',JSON.stringify(S))}catch(e){}scheduleSync()}

/* ---------- planilla de Google (base de datos) ---------- */
/* El link de conexión se guarda solo en este celular, nunca en el código público */
const DBK='luciana_db',QK='luciana_q';
let dbUrl=(()=>{try{return localStorage.getItem(DBK)||''}catch(e){return ''}})();
let queue=(()=>{try{return JSON.parse(localStorage.getItem(QK)||'[]')}catch(e){return []}})();
let curAct='home',syncT=null,syncing=false;
const okDbUrl=u=>/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(u);
function rec(ok,msg){
  if(!ACTS[curAct])return;
  queue.push({t:new Date().toISOString(),a:ACTS[curAct].t,ok,d:strip(msg||'').slice(0,140),s:S.stars});
  if(queue.length>500)queue=queue.slice(-500);
  try{localStorage.setItem(QK,JSON.stringify(queue))}catch(e){}
}
function scheduleSync(){if(!dbUrl)return;clearTimeout(syncT);syncT=setTimeout(pushDb,3000)}
async function pushDb(){
  if(!dbUrl||syncing)return false;syncing=true;const batch=queue.slice(0,200);let ok=false;
  try{
    const r=await fetch(dbUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({resultados:batch,progreso:S})});
    if((await r.json()).ok){ok=true;queue=queue.slice(batch.length);try{localStorage.setItem(QK,JSON.stringify(queue))}catch(e){}}
  }catch(e){}
  syncing=false;if(ok&&queue.length)scheduleSync();return ok;
}
async function pullDb(url=dbUrl){const j=await (await fetch(url)).json();if(!j.ok)throw new Error('planilla');return j}
function adopt(datos){const keep={upper:S.upper,rate:S.rate,voice:S.voice};S=Object.assign({},DEF,datos,keep);save();updateBadges()}

/* ---------- voz ---------- */
let voice=null, speakTok=0;
function pickVoice(){
  if(!('speechSynthesis' in window))return;
  const vs=speechSynthesis.getVoices();
  voice=vs.find(v=>v.voiceURI===S.voice)||vs.find(v=>/es[-_](AR|UY)/i.test(v.lang))||vs.find(v=>/es[-_](419|MX|US|CO|CL)/i.test(v.lang))||vs.find(v=>/^es/i.test(v.lang))||null;
}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(text,{rate=S.rate,pitch=1.15}={}){
  return new Promise(res=>{
    const clean=strip(text);
    let done=false;const fin=()=>{if(!done){done=true;$('#owl').classList.remove('talk');res()}};
    if(!clean||!('speechSynthesis' in window))return fin();
    const u=new SpeechSynthesisUtterance(clean.toLowerCase());
    u.lang=voice?voice.lang:'es-AR';if(voice)u.voice=voice;u.rate=rate;u.pitch=pitch;
    u.onend=fin;u.onerror=fin;
    setTimeout(fin,1800+clean.length*110/rate);
    // En celulares, hablar justo después de cancelar a veces no suena: esperamos un poquito
    const tok=speakTok;
    const start=()=>{if(tok!==speakTok)return fin();$('#owl').classList.add('talk');try{speechSynthesis.resume();speechSynthesis.speak(u)}catch(e){fin()}};
    if(performance.now()-lastCancel<250)setTimeout(start,150);else start();
  });
}
let lastCancel=0;
function hush(){speakTok++;lastCancel=performance.now();try{speechSynthesis.cancel()}catch(e){}$('#owl').classList.remove('talk')}
async function sayAll(parts,onEach,opts){const tok=++speakTok;for(let i=0;i<parts.length;i++){if(tok!==speakTok)return false;onEach&&onEach(i);await say(parts[i],opts)}return tok===speakTok}
let lastLula='';
function lula(text,speak=true){
  lastLula=text;const b=$('#bubble');b.textContent=text;b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop');
  if(speak){hush();return say(text)}return Promise.resolve();
}

/* ---------- sonidos ---------- */
let AC=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d=.15,type='sine',vol=.16,when=0){
  const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;
  const t=a.currentTime+when;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.05);
}
const sfx={
  tap:()=>tone(660,.07,'triangle',.1),
  pop:()=>tone(990,.06,'triangle',.12),
  ok:()=>{tone(784,.12);tone(988,.12,'sine',.16,.1);tone(1319,.3,'sine',.16,.2)},
  no:()=>{tone(320,.14,'triangle',.14);tone(250,.2,'triangle',.14,.12)},
  clac:()=>tone(150,.09,'square',.12),
  boing:()=>{tone(300,.08,'sine',.12);tone(520,.12,'sine',.1,.06)},
  splash:()=>{for(let i=0;i<6;i++)tone(400+Math.random()*900,.06,'triangle',.05,i*.03)},
  fanfare:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.25,'triangle',.14,i*.13))
};

/* ---------- premios ---------- */
const STK=['🦄','🐬','🦋','🐞','🌈','🍦','🧁','🍓','🐼','🦊','🐧','🦁','🐙','🐢','🦖','🚀','🪐','⭐','🌙','🌻','🌸','🍉','🎈','🎀','👑','🧜‍♀️','🧚','🐶','🐱','🐰','🦒','🐘','🐠','🍭','🎨','🪁','🦩','🐳','🌵','🍄'];
function updateBadges(bump){$('#nstar').textContent=S.stars;$('#nstk').textContent=S.stickers.length;if(bump){const p=$('#starPill');p.classList.remove('bump');void p.offsetWidth;p.classList.add('bump')}}
function confetti(n=18){const em=['⭐','🎉','✨','💖','🌟','🎈'];for(let i=0;i<n;i++){const s=document.createElement('span');s.className='confetti';s.textContent=pick(em);s.style.left=Math.random()*100+'vw';s.style.animationDelay=Math.random()*.4+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),2200)}}
function win(n=1,msg){
  rec(true,msg);
  S.stars+=n;save();sfx.ok();confetti();updateBadges(true);
  const p=msg?lula(msg):Promise.resolve();
  const want=Math.floor(S.stars/5);
  if(S.stickers.length<want&&S.stickers.length<STK.length){
    const left=STK.filter(s=>!S.stickers.includes(s));const ns=pick(left);S.stickers.push(ns);save();updateBadges();
    p.then(()=>wait(300)).then(()=>showNewSticker(ns));
  }
  return p;
}
function bump(id){S.done[id]=(S.done[id]||0)+1;save()}
function oops(el,msg){rec(false,msg);sfx.no();if(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')}if(msg)lula(msg)}
function modal(html){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="box">${html}</div>`;m.addEventListener('click',e=>{if(e.target===m||e.target.closest('[data-close]')){m.remove()}});document.body.appendChild(m);return m}
function showNewSticker(s){sfx.fanfare();modal(`<h2 class="center">¡Figurita nueva!</h2><div class="newstk">${s}</div><p class="center">Ya tenés ${S.stickers.length} en tu álbum.</p><div class="row"><button class="btn go" data-close>¡Genial!</button></div>`);say('¡Ganaste una figurita nueva para tu álbum!')}
function showAlbum(){sfx.tap();modal(`<h2>🎁 Mi álbum de figuritas</h2><p class="hint" style="text-align:left;margin:0 0 10px">Tenés ${S.stickers.length} de ${STK.length}. Cada 5 estrellas ganás una nueva.</p><div class="stkgrid">${STK.map(s=>S.stickers.includes(s)?`<div>${s}</div>`:`<div class="lock">?</div>`).join('')}</div><div class="row"><button class="btn" data-close>Cerrar</button></div>`)}

/* ---------- contenido: letras ---------- */
const ABC=[
 ['A','a','abeja','🐝',''],['B','be','ballena','🐋','ba, be, bi, bo, bu'],['C','ce','casa','🏠','ca, co, cu'],['D','de','dado','🎲','da, de, di, do, du'],

 ['I','i','isla','🏝️',''],['J','jota','jirafa','🦒','ja, je, ji, jo, ju'],['K','ka','koala','🐨','ka, ki'],['L','ele','león','🦁','la, le, li, lo, lu'],
 ['M','eme','mono','🐒','ma, me, mi, mo, mu'],['N','ene','nube','☁️','na, ne, ni, no, nu'],['Ñ','eñe','ñandú','🪶','ña, ñe, ñi, ño, ñu'],['O','o','oso','🐻',''],
 ['P','pe','pato','🦆','pa, pe, pi, po, pu'],['Q','cu','queso','🧀','que, qui'],['R','erre','ratón','🐭','ra, re, ri, ro, ru'],['S','ese','sol','☀️','sa, se, si, so, su'],
 ['T','te','tortuga','🐢','ta, te, ti, to, tu'],['U','u','uva','🍇',''],['V','ve corta','vaca','🐮','va, ve, vi, vo, vu'],['W','doble ve','wafle','🧇','wa, we, wi'],
 ['X','equis','xilófono','🎶','xa, xe, xi'],['Y','ye','yoyó','🪀','ya, ye, yi, yo, yu'],['Z','zeta','zapato','👟','za, zo, zu']
].map(([L,name,word,e,syl])=>({L,name,word,e,syl}));
const AL=Object.fromEntries(ABC.map(a=>[a.L,a]));
const isVow=L=>'AEIOU'.includes(L);
const RAW_WORDS=[
 ['MO-NO','🐒'],['PA-TO','🦆'],['GA-TO','🐱'],['SO-PA','🍲'],['LU-NA','🌙'],['CA-SA','🏠'],['VA-CA','🐮'],['DA-DO','🎲'],['NU-BE','☁️'],['RO-SA','🌹'],
 ['LO-RO','🦜'],['SA-PO','🐸'],['PI-ÑA','🍍'],['CA-MA','🛏️'],['BO-TA','👢'],['PA-PA','🥔'],['LU-PA','🔍'],['TA-ZA','☕'],['MA-NO','✋'],['PE-RA','🍐'],
 ['VE-LA','🕯️'],['FO-CA','🦭'],['HA-DA','🧚'],['DE-DO','👆'],['PU-MA','🐆'],['CO-CO','🥥'],['TO-RO','🐂'],['BE-SO','💋'],['GO-TA','💧'],['RO-PA','👕'],
 ['SO-FÁ','🛋️'],['PA-VO','🦃'],['JU-GO','🧃'],['MA-PA','🗺️'],['SE-TA','🍄'],['LO-BO','🐺'],['MO-TO','🏍️'],['RA-TÓN','🐭'],['LI-MÓN','🍋'],

function actAbc(st,arg){

  const lc=$('#lc');let singing=false;

    if(speak)speakLetter(a);
  }
  function speakLetter(a){
    hush();const parts=[`la ${a.name}`];if(a.syl)parts.push(a.syl);parts.push(`¡${a.word}!`);
    lula(`${fmt(a.L)} de ${a.word.toUpperCase()}`,false);sayAll(parts,null);
  }
  $('#grid').onclick=e=>{const b=e.target.closest('.lt');if(!b||singing)return;sfx.pop();show(b.dataset.l)};
  $('#sing').onclick=async()=>{
    const btn=$('#sing');
    if(singing){singing=false;hush();btn.textContent='🎵 Cantar el abecedario';$$('.lt').forEach(x=>x.classList.remove('now'));return}
    singing=true;btn.textContent='⏹ Parar';hush();

    $$('.lt').forEach(x=>x.classList.remove('now'));
    if(singing&&ok){singing=false;btn.textContent='🎵 Cantar el abecedario';win(1,'¡Bravo! Cantamos todo el abecedario. ¡Son 27 letras!')}
  };
  $('#find').onclick=()=>findGame();
  function findGame(){
    let round=0,hits=0;
    const next=()=>{
      if(round===5){bump('abc');lc.innerHTML=`<p class="qtitle">¡Encontraste ${hits} letras! 🎉</p><div class="row"><button class="btn go" id="more">Jugar otra vez</button><button class="btn" id="bk">Volver al abecedario</button></div>`;$('#more').onclick=findGame;$('#bk').onclick=()=>show(pick(ABC).L,false);return}
      round++;const pool=ABC.filter(a=>S.seen[a.L]);const t=pick(pool.length>=6&&Math.random()<.7?pool:ABC);
      const opts=shuffle([t,...shuffle(ABC.filter(a=>a!==t)).slice(0,3)]);let tries=0;
      lc.innerHTML=`<p class="qtitle">¿Dónde está la <span class="${isVow(t.L)?'v':'c'}">${t.name}</span>? <button class="btn" id="rep" style="min-height:44px">🔊</button></p><div class="opts">${opts.map(a=>`<button class="opt ${isVow(a.L)?'v':'c'}" data-l="${a.L}">${fmt(a.L)}</button>`).join('')}</div><p class="hint">Ronda ${round} de 5</p>`;
      lula(`¿Dónde está la ${t.name}?`);$('#rep').onclick=()=>lula(`¿Dónde está la ${t.name}?`);

/* ---------- 2. Trazar ---------- */
function actTrazar(st,arg){
  const NAME='LUCIANA';
  let mode=arg==='NAME'?'name':'letter',L=arg&&AL[arg]?arg:'A',ni=0;
  st.innerHTML=`<div class="chips" id="chips"><button class="chip name" data-n="1">⭐ Mi nombre</button>${ABC.map(a=>`<button class="chip ${isVow(a.L)?'v':'c'}" data-l="${a.L}">${fmt(a.L)}</button>`).join('')}</div>
  <div id="np"></div>
  <div class="tracewrap" id="tw"><canvas id="tc"></canvas><div class="tracetag" id="tag"></div></div>
  <div class="row"><button class="btn" id="clr">🧽 Borrar</button><button class="btn sun" id="hear">🔊</button><button class="btn go" id="ok">✓ ¡Listo!</button></div>`;
  const cv=$('#tc'),ctx=cv.getContext('2d');let W=0,H=0,dpr=1,fs=100,baseY=0,paths=[],cur=null;
  const target=()=>mode==='name'?NAME[ni]:L;
  const glyph=()=>fmt(target());
  function size(){const r=$('#tw').getBoundingClientRect();dpr=Math.min(2,window.devicePixelRatio||1);W=r.width-6;H=Math.round(Math.min(460,Math.max(300,W*.85)));cv.width=W*dpr;cv.height=H*dpr;cv.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);layout();draw()}
  function layout(){
    ctx.font=`700 100px Andika, sans-serif`;const m=ctx.measureText(glyph());
    const h=(m.actualBoundingBoxAscent+m.actualBoundingBoxDescent)||70,w=m.width||60;
    fs=Math.min(100*(H*.7)/h,100*(W*.8)/w);
    ctx.font=`700 ${fs}px Andika, sans-serif`;const m2=ctx.measureText(glyph());
    baseY=H/2+((m2.actualBoundingBoxAscent||fs*.7)-(m2.actualBoundingBoxDescent||0))/2;
  }
  const lw=()=>Math.max(14,fs*.1);
  function drawGuide(c,fill,stroke,dash){c.font=`700 ${fs}px Andika, sans-serif`;c.textAlign='center';c.textBaseline='alphabetic';if(fill){c.fillStyle=fill;c.fillText(glyph(),W/2,baseY)}if(stroke){c.setLineDash(dash||[]);c.lineWidth=3;c.strokeStyle=stroke;c.strokeText(glyph(),W/2,baseY);c.setLineDash([])}}
  function drawPaths(c,width,color){c.lineCap='round';c.lineJoin='round';c.lineWidth=width;paths.forEach((p,i)=>{c.strokeStyle=color||`hsl(${(i*55+330)%360} 85% 55%)`;c.beginPath();p.forEach((q,j)=>j?c.lineTo(q[0],q[1]):c.moveTo(q[0],q[1]));if(p.length===1)c.lineTo(p[0][0]+.1,p[0][1]);c.stroke()})}
  let dots=null;
  function dotPattern(){const c=document.createElement('canvas');c.width=c.height=14;const x=c.getContext('2d');x.fillStyle='#8FA9C8';x.beginPath();x.arc(7,7,2.6,0,7);x.fill();return ctx.createPattern(c,'repeat')}
  function draw(){ctx.clearRect(0,0,W,H);drawGuide(ctx,'#E6EEF8');dots=dots||dotPattern();drawGuide(ctx,dots);drawPaths(ctx,lw())}
  function render(){
    $$('.chip',st).forEach(c=>c.classList.toggle('on',mode==='name'?!!c.dataset.n:c.dataset.l===L));
    $('#np').innerHTML=mode==='name'?`<div class="nameprog">${[...NAME].map((ch,i)=>`<span class="${i<ni?'done':''} ${i===ni?'cur':''} ${isVow(ch)?'v':'c'}">${fmt(ch)}</span>`).join('')}</div>`:'';
    const a=AL[target()];$('#tag').textContent=`${a.e} ${fmt(a.word)}`;
    paths=[];layout();draw();
  }
  function intro(){const a=AL[target()];lula(mode==='name'?`Vamos a escribir tu nombre. Ahora la ${a.name}. Seguí la línea punteada con el dedo.`:`Trazá la ${a.name} con el dedo, siguiendo los puntitos.`)}
  function evaluate(){
    const k=.25,w=Math.ceil(W*k),h=Math.ceil(H*k);
    const mk=()=>{const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.scale(k,k);return x};
    const g=mk(),gd=mk(),uw=mk(),un=mk();
    drawGuide(g,'#000');drawGuide(gd,'#000');gd.lineWidth=lw()*1.1;gd.strokeStyle='#000';gd.strokeText(glyph(),W/2,baseY);
    drawPaths(uw,lw()*1.5,'#000');drawPaths(un,lw()*.8,'#000');
    const A=x=>x.getImageData(0,0,w,h).data;const G=A(g),GD=A(gd),UW=A(uw),UN=A(un);
    let gc=0,cov=0,uc=0,ins=0;
    for(let i=3;i<G.length;i+=4){if(G[i]>60){gc++;if(UW[i]>60)cov++}if(UN[i]>60){uc++;if(GD[i]>60)ins++}}
    return {coverage:gc?cov/gc:0,precision:uc?ins/uc:0,ink:uc/(gc||1)};
  }
  cv.style.touchAction='none';
  const pos=e=>{const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]};
  cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);cur=[pos(e)];paths.push(cur);draw()};
  cv.onpointermove=e=>{if(!cur)return;cur.push(pos(e));draw()};
  cv.onpointerup=cv.onpointercancel=()=>{cur=null};
  $('#clr').onclick=()=>{sfx.tap();paths=[];draw()};
  $('#hear').onclick=()=>{const a=AL[target()];hush();sayAll([`la ${a.name}`,a.word])};
  $('#ok').onclick=()=>{
    if(!paths.length)return lula('Primero pasá el dedo por la letra.');
    const r=evaluate();
    if(r.coverage>=.5&&r.precision>=.55&&r.ink>.25){
      const t=target();S.traced[t]=true;S.seen[t]=true;save();bump('trazar');
      if(mode==='name'){
        ni++;if(ni>=NAME.length){win(3,'¡Escribiste tu nombre: Luciana! ¡Sos una genia!');sfx.fanfare();ni=0;setTimeout(render,2500);return}
        win(1,`¡Muy bien! Ahora la ${AL[NAME[ni]].name}.`);setTimeout(render,900);
      }else{win(1,`¡Hermosa ${AL[t].name}!`);setTimeout(()=>{paths=[];draw()},1200)}
    }else if(r.coverage<.5){oops($('#tw'),'Te faltó un pedacito. Seguí toda la línea punteada.')}
    else oops($('#tw'),'Casi. Tratá de quedarte adentro de la letra. ¡Probá otra vez!');
  };
  $('#chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;sfx.pop();if(b.dataset.n){mode='name';ni=0}else{mode='letter';L=b.dataset.l}render();intro()};
  const onR=()=>size();window.addEventListener('resize',onR);cleanup=()=>window.removeEventListener('resize',onR);
  const start=()=>{size();render();intro();const on=$('.chip.on',st);on&&on.scrollIntoView({inline:'center',block:'nearest'})};
  (document.fonts?document.fonts.load('700 100px Andika').catch(()=>{}):Promise.resolve()).then(start);
}

/* ---------- 3. Armar palabras con sílabas ---------- */
function actSilabas(st){
  function round(){
    const lv=levelWords('silabas');const w=nextOf('sil'+lv.length,lv);
    const extra=shuffle(ALLSYL.filter(s=>!w.s.includes(s))).slice(0,w.s.length>2?2:1);
    const pool=shuffle([...w.s,...extra]);let idx=0,miss=0;
    st.innerHTML=`<div class="panel center"><div class="wordpic" data-say="${w.word}">${w.e}</div>
      <div class="slots" id="slots">${w.s.map(()=>`<div class="slot"></div>`).join('')}</div>
      <div class="pool" id="pool">${pool.map(s=>`<button class="opt" data-s="${s}">${cw(s)}</button>`).join('')}</div>
      <div class="row"><button class="btn sun" id="hear">🔊 Escuchar</button></div></div>`;
    const ask=()=>lula(`Armá la palabra ${w.word}. ¿Con qué sílaba empieza?`);
    ask();$('#hear').onclick=()=>{hush();sayAll(w.s.concat(w.word),null,{rate:.7})};
    $('#pool').onclick=async e=>{
      const b=e.target.closest('.opt');if(!b||b.classList.contains('used')||idx>=w.s.length)return;
      if(b.dataset.s===w.s[idx]){
        b.classList.add('used');const sl=$$('.slot')[idx];sl.innerHTML=cw(w.s[idx]);sl.classList.add('full');sfx.pop();hush();say(w.s[idx]);idx++;
        if(idx===w.s.length){
          bump('silabas');await wait(500);hush();
          await sayAll(w.s,i=>{$$('.slot').forEach((x,j)=>x.classList.toggle('lit',j===i))},{rate:.75});
          $$('.slot').forEach(x=>x.classList.remove('lit'));
          await win(miss?1:2,`¡${w.word}! ¡Lo armaste!`);
          st.querySelector('.panel').insertAdjacentHTML('beforeend',`<div class="row"><button class="btn go" id="nx">Otra palabra ▶</button></div>`);$('#nx').onclick=round;
        }else lula(`¡Bien! ¿Y después de ${w.s.slice(0,idx).join(' ')}?`,false);
      }else{miss++;oops(b,`Esa dice ${b.dataset.s}. Buscá la que dice ${w.s[idx]}.`)}
    };
  }
  round();
}

/* ---------- 4. Primer sonido ---------- */
function actSonido(st){
  function round(){
    const w=nextOf('son',WORDS.filter(x=>!/^(h|ce|ci|ge|gi|lu-cia)/.test(x.s.join('-'))&&x.word!=='luciana'));
    const F=firstLetter(w);const others=shuffle(ABC.filter(a=>a.L!==F&&a.L!=='H'&&a.L!=='Ñ')).slice(0,S.done.sonido>8?3:2).map(a=>a.L);
    const opts=shuffle([F,...others]);
    st.innerHTML=`<div class="panel center"><div class="wordpic" data-say="${w.word}">${w.e}</div>
      <div class="bigword" id="bw"><span class="c">?</span>${cw(w.word.slice(1))}</div>

function plantSVG(s){
  const h=[0,16,48,78,104,112][s],top=158-h;
  const leaf=(x,y,d,z)=>`<path d="M${x} ${y} q${d*z*.5} ${-z*.75} ${d*z} ${-z*.15} q${-d*z*.35} ${z*.6} ${-d*z} ${z*.15}z" fill="#3DAA5C"/>`;
  let g=`<rect x="0" y="0" width="240" height="240" fill="#F3F8FE"/><circle cx="205" cy="34" r="20" fill="#FFC531"/>`;
  if(s===0)g+=`<ellipse cx="120" cy="160" rx="8" ry="5" fill="#8B5A2B"/>`;
  else{
    g+=`<path d="M120 160 Q${s>2?126:121} ${160-h/2} 120 ${top}" stroke="#2F8C4A" stroke-width="${s>3?6:4}" fill="none" stroke-linecap="round"/>`;
    if(s===1)g+=leaf(120,top+2,-1,12)+leaf(120,top+2,1,12);
    if(s>=2)g+=leaf(121,160-h*.35,-1,26)+leaf(121,160-h*.35,1,26);
    if(s>=3)g+=leaf(122,160-h*.65,-1,22)+leaf(122,160-h*.65,1,22);
    if(s===4)g+=`<ellipse cx="120" cy="${top-6}" rx="9" ry="13" fill="#5BBF6B"/>`;
    if(s===5){for(let i=0;i<14;i++)g+=`<ellipse cx="120" cy="${top-30}" rx="7" ry="20" fill="#FFC531" transform="rotate(${i*360/14} 120 ${top-6}) translate(0 ${-0})"/>`;g+=`<circle cx="120" cy="${top-6}" r="15" fill="#7A4A1E"/><circle cx="115" cy="${top-9}" r="2" fill="#4a2c10"/><circle cx="124" cy="${top-4}" r="2" fill="#4a2c10"/>`}
  }
  g+=`<ellipse cx="120" cy="160" rx="52" ry="7" fill="#6B4A2B"/><rect x="62" y="156" width="116" height="16" rx="6" fill="#C2653C"/><path d="M70 170h100l-12 58H82z" fill="#D9774B"/>`;
  return `<svg viewBox="0 0 240 240" role="img" aria-label="Maceta">${g}</svg>`;
}

  function explain(id){const key=place+'_'+id;lula(GEX[place][id]);if(!S.grav[key]){S.grav[key]=1;save();win(1)}}
  function drop(id,quiet){
    const o=GOBJ.find(x=>x.id===id),P=PLACES[place];
    if(id==='nena'){
      let b=bodies.find(x=>x.o.id==='nena');
      if(!b){b={o,x:colX(id),y:P.ground?G-o.r:H/2,vx:0,vy:0,ph:0};bodies.push(b)}
      if(P.g===0){b.vy=-40;b.vx=(Math.random()-.5)*30}
      else if(b.y>=G-o.r-1){b.vy=-420;sfx.boing()}
    }else{
      bodies=bodies.filter(b=>b.o.id!==id||bodies.filter(x=>x.o.id===id).length<3);
      const sp=P.g===0;bodies.push({o,x:colX(id),y:sp?H*.3+Math.random()*H*.3:o.r+6,vx:sp?(Math.random()-.5)*50:0,vy:sp?(Math.random()-.5)*50:0,ph:Math.random()*6,landed:false});
      if(bodies.length>14)bodies.shift();
    }
    if(!quiet)explain(id);
  }
  function step(dt){
    const P=PLACES[place];t+=dt;
    for(const b of bodies){
      const o=b.o;
      if(P.g===0){b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.x<o.r||b.x>W-o.r){b.vx*=-1;b.x=Math.max(o.r,Math.min(W-o.r,b.x))}if(b.y<o.r||b.y>H-o.r){b.vy*=-1;b.y=Math.max(o.r,Math.min(H-o.r,b.y))}continue}
      let a=P.g;if(P.air){a-=P.g*(o.buoy||0);a-=o.k*b.vy}
      b.vy+=a*dt;b.y+=b.vy*dt;
      if(P.air&&o.sway&&!b.landed)b.x+=Math.sin(t*2.5+b.ph)*o.sway*dt;
      const floor=G-o.r;
      if(b.y>floor){b.y=floor;if(b.vy>80&&o.el>0){b.vy=-b.vy*o.el;if(o.id==='pelota')tone(220+Math.random()*60,.06,'sine',.08)}else{b.vy=0;if(!b.landed){b.landed=true;b.tl=t}}}
      if(o.buoy&&P.air&&b.y<o.r){b.y=o.r;b.vy=0}
    }
    if(race&&!race.said){const rb=race.bodies;if(P.g===0){if(t-race.t>2.5){race.said=1;lula('¡Ninguna llega! En el espacio todo flota.')}}else if(rb.every(b=>b.landed)){race.said=1;const d=Math.abs(rb[0].tl-rb[1].tl);
      if(d<.12)lula('¡Empate! Sin aire, todo cae igual de rápido. Un astronauta lo probó de verdad en la Luna, con un martillo y una pluma.');
      else lula('¡Ganó la manzana! El aire frena mucho a la pluma. ¿Y si probamos en la Luna, donde no hay aire?');
      if(!S.grav['race_'+place]){S.grav['race_'+place]=1;save();win(1)}}}
  }
  function draw(){
    const P=PLACES[place];const gr=ctx.createLinearGradient(0,0,0,H);gr.addColorStop(0,P.sky[0]);gr.addColorStop(1,P.sky[1]);ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
    if(place!=='tierra'){ctx.fillStyle='#fff';dots.forEach(([x,y,r])=>{ctx.globalAlpha=.5+.5*Math.sin(t*2+x*20);ctx.beginPath();ctx.arc(x*W,y*H,r,0,7);ctx.fill()});ctx.globalAlpha=1}
    else{ctx.font='34px serif';ctx.textAlign='center';ctx.fillText('☁️',W*.2+Math.sin(t*.2)*20,50);ctx.fillText('☁️',W*.75,80)}
    if(place==='luna'){ctx.font='30px serif';ctx.fillText('🌍',W-40,46)}
    if(P.ground){ctx.fillStyle=P.ground;ctx.fillRect(0,G,W,H-G);if(place==='luna'){ctx.fillStyle='rgba(0,0,0,.12)';[[.2,10,14],[.55,18,9],[.8,8,16]].forEach(([x,y,r])=>{ctx.beginPath();ctx.ellipse(x*W,G+y,r*1.6,r*.5,0,0,7);ctx.fill()})}}
    else{ctx.font='38px serif';ctx.fillText('🛰️',W*.85,H*.85)}
    ctx.textAlign='center';ctx.textBaseline='middle';
    for(const b of bodies){const o=b.o;ctx.save();ctx.translate(b.x,b.y);if(o.id==='pluma'&&!b.landed)ctx.rotate(Math.sin(t*2.5+b.ph)*.5);if(PLACES[place].g===0)ctx.rotate(Math.sin(t+b.ph)*.4);ctx.font=`${o.r*2}px serif`;ctx.fillText(o.e,0,2);ctx.restore();
      if(b.y<-o.r){ctx.font='bold 18px sans-serif';ctx.fillStyle='#fff';ctx.fillText(`⬆ ${o.e} ¡altísimo!`,Math.min(W-60,Math.max(60,b.x)),18)}}
    ctx.textBaseline='alphabetic';
  }
  function loop(now){const dt=Math.min(.04,(now-last)/1000);last=now;step(dt);draw();raf=requestAnimationFrame(loop)}
  $('#places').onclick=e=>{const b=e.target.closest('[data-p]');if(!b)return;sfx.tap();setPlace(b.dataset.p);lula(PLACES[b.dataset.p].info+'. ¡Soltá algo y mirá qué pasa!')};
  $('#objs').onclick=e=>{const b=e.target.closest('.obj');if(!b)return;sfx.pop();drop(b.dataset.o)};
  $('#race').onclick=()=>{sfx.tap();bodies=bodies.filter(b=>b.o.id==='nena');drop('manzana',1);drop('pluma',1);const rb=bodies.slice(-2);race={bodies:rb,t,said:0};lula('¡Carrera! Las soltamos juntas. ¿Cuál llega primero al piso?')};
  $('#clr').onclick=()=>{sfx.tap();bodies=[];race=null};
  const onR=()=>size();window.addEventListener('resize',onR);
  setPlace('tierra');raf=requestAnimationFrame(loop);
  lula('Este es el laboratorio de gravedad. Tocá un objeto para soltarlo. ¿Cuál cae más rápido?');
  cleanup=()=>{cancelAnimationFrame(raf);window.removeEventListener('resize',onR)};
}

/* ---------- 12. Flota o se hunde ---------- */
const FLO=[['🪨','piedra',0,'La piedra es muy pesada para su tamaño. Por eso se hunde.'],['🦆','patito de goma',1,'El patito tiene aire adentro. ¡El aire lo ayuda a flotar!'],['🍎','manzana',1,'¡Sorpresa! La manzana flota, porque tiene aire escondido adentro.'],['🔑','llave',0,'La llave es de metal, chiquita y pesada. Se hunde.'],['🍃','hoja',1,'La hoja es livianita y plana. Flota.'],['⛵','barquito',1,'Los barcos tienen forma de cuenco, con mucho aire adentro. Por eso flotan.'],['🥚','huevo',0,'El huevo se hunde en el agua. ¡Pero si le ponés mucha sal al agua, flota!'],['🧽','esponja',1,'La esponja está llena de agujeritos con aire. Flota.'],['🥄','cuchara',0,'La cuchara es de metal. Se hunde.'],['🍊','naranja',1,'La naranja flota gracias a su cáscara, que tiene aire. ¡Pelada se hunde!'],['🪵','madera',1,'La madera es liviana para su tamaño. Flota.'],['⚓','ancla',0,'El ancla es pesadísima. Los barcos la tiran al agua para quedarse quietos.']];

  let list=shuffle(FLO),i=0,hits=0;

    if(i>=list.length){bump('flota');st.innerHTML=`<div class="panel center"><p class="qtitle">¡Probaste todo! Adivinaste ${hits} de ${list.length}.</p><p class="answer">Las cosas pesadas para su tamaño se hunden. Las que tienen aire adentro, flotan.</p><div class="row"><button class="btn go" id="nx">Jugar otra vez</button></div></div>`;$('#nx').onclick=()=>actFlota(st);win(2,'Las cosas pesadas para su tamaño se hunden. Las que tienen mucho aire adentro, flotan.');return}
    const x=list[i];
    st.innerHTML=`<div class="tank" id="tank"><div class="water"></div><div class="fo" id="fo" data-say="${x[1]}">${x[0]}</div></div><div class="fname">${cw(x[1])}</div>
    <p class="qtitle">¿Qué creés que va a pasar?</p><div class="row" id="gs"><button class="btn blue" data-g="1">🛟 Flota</button><button class="btn" data-g="0">⚓ Se hunde</button></div>`;
    lula(`¿${x[1]}: flota o se hunde?`);
    $$('#gs .btn').forEach(b=>b.onclick=async()=>{
      $('#gs').innerHTML='';const fo=$('#fo'),guess=+b.dataset.g;
      if(x[2]){fo.style.top='calc(42% - 44px)'}else{fo.classList.add('sink');fo.style.top='calc(100% - 74px)'}
      await wait(700);sfx.splash();await wait(x[2]?500:1500);if(x[2])fo.classList.add('bob');

    });

}

function actSombras(st){
  st.innerHTML=`<div class="sunbox"><svg viewBox="0 0 400 250" id="sv">
    <rect id="skyr" width="400" height="200" fill="#8FD3FF"/>
    <g id="starsg" opacity="0">${Array.from({length:30},()=>`<circle cx="${Math.random()*400|0}" cy="${Math.random()*170|0}" r="${(Math.random()*1.4+.6).toFixed(1)}" fill="#fff"/>`).join('')}</g>
    <circle id="sun" r="20" fill="#FFC531"/><text id="moon" font-size="34" text-anchor="middle" opacity="0" x="320" y="60">🌙</text>
    <rect y="200" width="400" height="50" fill="#5DBB63" id="grass"/>
    <ellipse id="tsh" cy="206" ry="10" fill="rgba(15,35,25,.5)"/><ellipse id="gsh" cy="206" ry="6" fill="rgba(15,35,25,.5)"/>
    <text x="240" y="207" font-size="120" text-anchor="middle">🌳</text><text x="110" y="206" font-size="48" text-anchor="middle">👧</text>
  </svg></div>
  <input type="range" class="slider" id="sl" min="0" max="100" value="20" aria-label="Mover el sol">
  <div class="clock" id="clk"></div>
  <p class="hint">Mové la bolita para que pase el día</p>`;
  let zone='';
  const mix=(a,b,f)=>{const p=x=>[1,3,5].map(i=>parseInt(x.slice(i,i+2),16));const A=p(a),B=p(b);return `rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*f)).join(',')})`};
  function upd(){
    const v=+$('#sl').value,t=6+v*.15,day=t<=18,e=day?Math.sin(Math.PI*(t-6)/12):0;
    const sx=40+(t-6)/12*320,sy=200-e*170;
    $('#sun').setAttribute('cx',sx);$('#sun').setAttribute('cy',day?sy:260);
    const sky=!day?mix('#FF9E6B','#0E1A3A',Math.min(1,(t-18)/1.5)):e<.3?mix('#FF9E6B','#8FD3FF',e/.3):'#8FD3FF';
    $('#skyr').setAttribute('fill',sky);$('#starsg').setAttribute('opacity',day?0:Math.min(1,(t-18)/1.5));$('#moon').setAttribute('opacity',day?0:Math.min(1,(t-18)/1.5));
    $('#grass').setAttribute('fill',day?'#5DBB63':'#2E6B45');
    const shadow=(id,x,h)=>{const el=$('#'+id);if(!day||e<.04){el.setAttribute('rx',0);return}const ang=e*72*Math.PI/180;const L=Math.min(320,h/Math.tan(ang));const dir=sx<x?1:-1;el.setAttribute('cx',x+dir*L/2);el.setAttribute('rx',L/2+8)};
    shadow('tsh',240,110);shadow('gsh',110,44);
    const hr=Math.floor(t),h12=hr>12?hr-12:hr,part=hr<12?'de la mañana':hr===12?'del mediodía':hr<20?'de la tarde':'de la noche';
    $('#clk').textContent=`${!day?'🌙':'🕐'} Son las ${h12} ${part}`;
    const z=!day&&t>=18.8?'noche':t>=11.4&&t<=12.6?'mediodia':t<=8.5?'manana':t>=15.5&&day?'tarde':'';
    if(z&&z!==zone){zone=z;const msg={manana:'A la mañana el sol está bajito y las sombras son larguísimas.',mediodia:'Al mediodía el sol está bien arriba. ¡Mirá qué cortita es la sombra!',tarde:'A la tarde el sol baja del otro lado. Ahora la sombra apunta para el otro lado.',noche:'Es de noche. La Tierra giró y ahora el sol alumbra el otro lado del mundo.'}[z];
      if(!S.zones[z]){S.zones[z]=1;save();win(1,msg)}else lula(msg);
      if(Object.keys(S.zones).length===4&&!S.zones.all){S.zones.all=1;save();bump('sombras')}}
  }
  $('#sl').oninput=upd;upd();
  lula('La sombra aparece cuando tapamos la luz del sol. Mové el sol y mirá qué pasa con las sombras.');
}

function actPorque(st,arg){
  function list(){
    st.innerHTML=`<div class="row" style="margin-top:4px"><button class="btn sun" id="rnd">🎲 Pregunta sorpresa</button></div>
    <div class="whys">${WHY.map((w,i)=>`<button class="whycard ${S.whys[i]?'seen':''}" data-i="${i}"><span class="em">${w.e}</span><b>${w.q}</b></button>`).join('')}</div>`;
    lula('¡Me encantan los porqués! Elegí una pregunta.');
    $('#rnd').onclick=()=>{sfx.tap();const un=WHY.map((_,i)=>i).filter(i=>!S.whys[i]);detail(pick(un.length?un:WHY.map((_,i)=>i)))};
    st.onclick=e=>{const b=e.target.closest('.whycard');if(b&&armTap(b,WHY[+b.dataset.i].q))detail(+b.dataset.i)};
  }
  function detail(i){
    st.onclick=null;const w=WHY[i];window.scrollTo(0,0);

    st.innerHTML=`<div class="panel whydetail"><div class="em">${w.e}</div><h2>${w.q}</h2>
      <p class="answer" id="ans">${sents.map((s,j)=>`<span data-j="${j}">${s.trim()}</span>`).join(' ')}</p>
      <div class="row"><button class="btn sun" id="play">🔊 Escuchar</button>${w.lab?`<button class="btn go" id="lab">${ACTS[w.lab].e} Ir a probarlo</button>`:''}</div>
      <div class="home-try"><b>🏠 Probalo en casa</b>${w.h}</div>
      <div class="row"><button class="btn" id="lst">⬅️ Más preguntas</button><button class="btn blue" id="nx">Otra pregunta ▶</button></div></div>`;
    const read=async()=>{hush();lula(w.q,false);await say(w.q);const ok=await sayAll(sents,j=>{$$('#ans span').forEach((x,k)=>x.classList.toggle('lit',k===j))});$$('#ans span').forEach(x=>x.classList.remove('lit'));return ok};
    $('#play').onclick=read;$('#lst').onclick=()=>{sfx.tap();hush();list()};
    $('#nx').onclick=()=>{sfx.tap();detail((i+1)%WHY.length)};
    if(w.lab)$('#lab').onclick=()=>go(w.lab,w.arg);
    $('#ans').onclick=e=>{const s=e.target.closest('span');if(!s)return;hush();$$('#ans span').forEach(x=>x.classList.toggle('lit',x===s));say(s.textContent).then(()=>s.classList.remove('lit'))};
    read().then(ok=>{if(ok&&!S.whys[i]){S.whys[i]=1;save();bump('porque');win(1,'¡Una pregunta nueva! Ahora sabés algo más.')}});
  }
  if(arg!=null&&WHY[arg])detail(+arg);else list();
}

/* ---------- Números ---------- */
const NU=['cero','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve','veinte','veintiuno','veintidós','veintitrés','veinticuatro','veinticinco','veintiséis','veintisiete','veintiocho','veintinueve'];
const NT=['','','','treinta','cuarenta','cincuenta','sesenta','setenta','ochenta','noventa'];
function nw(n,fem){const w=n===100?'cien':n<30?NU[n]:NT[n/10|0]+(n%10?' y '+NU[n%10]:'');return fem?w.replace(/uno$/,'una'):w}
function decTxt(n){const d=n/10|0,u=n%10;if(n===100)return 'diez decenas';const D=d?`${d===1?'una decena':nw(d,1)+' decenas'}`:'',U=u?`${u===1?'una unidad':nw(u,1)+' unidades'}`:'';return [D,U].filter(Boolean).join(' y ')}
const bars=k=>`<span class="ob bar" data-v="10">${'<i></i>'.repeat(10)}</span>`.repeat(k);
const blocks=n=>bars(n/10|0)+(n%10?`<span class="units">${'<span class="ob unit" data-v="1"></span>'.repeat(n%10)}</span>`:'');
const objs=(n,e,cls='')=>`<span class="ob ${cls}" data-v="1">${e}</span>`.repeat(n);
const numOpt=n=>`<button class="opt num" data-n="${n}" data-say="${nw(n)}">${n}</button>`;
function numOpts(ans,step=1,max=100){
  const c=shuffle([ans+step,ans-step,ans+2*step,ans-2*step,ans+3*step].filter(x=>x>=1&&x<=max&&x!==ans));
  return shuffle([ans,...c.slice(0,2)]);
}
/* Tocar cosas para contarlas: cada toque dice cuántas van */
function countable(root){
  root.addEventListener('click',e=>{
    const o=e.target.closest('.ob');if(!o||o.classList.contains('gone')||o.classList.contains('counted'))return;
    o.classList.add('counted');sfx.pop();
    const tot=$$('.ob.counted',root).reduce((s,x)=>s+ +x.dataset.v,0);hush();say(nw(tot));
  });
}
async function countAll(root){
  const obs=$$('.ob:not(.gone)',root);obs.forEach(o=>o.classList.remove('counted'));hush();
  let tot=0;const parts=obs.map(o=>nw(tot+=+o.dataset.v));
  const ok=await sayAll(parts,i=>obs[i].classList.add('counted'),{rate:1});
  return ok;
}
function numLevel(id,a,b,c){const d=S.done[id]||0;return d<a?0:d<b?1:d<c?2:3}

/* 1. Números del 1 al 100 */

  st.innerHTML=`<div class="panel" id="nc"></div>

  const nc=$('#nc');let counting=false;
  function show(n,speak=true){
    const s=String(n),dg=n>=10&&n<100?`<span class="d">${s[0]}</span><span class="u">${s[1]}</span>`:`<span class="${n<10?'u':'d'}">${s}</span>`;
    nc.innerHTML=`<div class="numcard"><div class="big">${dg}</div><div><div class="word">${nw(n)}</div>${n>=10?`<div class="dec">${decTxt(n)}</div>`:''}</div>

    countable($('#bl'));

  }
  $('#grid').onclick=e=>{const b=e.target.closest('.nm');if(!b||counting)return;sfx.pop();show(+b.dataset.n)};
  $('#cnt').onclick=async()=>{
    const btn=$('#cnt'),cells=$$('.nm',$('#grid'));
    if(counting){counting=false;hush();btn.textContent='🎵 Contar hasta 100';cells.forEach(x=>x.classList.remove('now'));return}
    counting=true;btn.textContent='⏹ Parar';hush();
    const ok=await sayAll(cells.map((_,i)=>nw(i+1)),i=>{cells.forEach(x=>x.classList.remove('now'));cells[i].classList.add('now');cells[i].scrollIntoView({block:'nearest',behavior:'smooth'})},{rate:1.1});
    cells.forEach(x=>x.classList.remove('now'));

  };
  $('#find').onclick=()=>findGame();
  function findGame(){
    let round=0,hits=0;const max=[20,50,100,100][numLevel('numeros',4,10,99)];
    const next=()=>{
      if(round===5){bump('numeros');nc.innerHTML=`<p class="qtitle">¡Encontraste ${hits} números! 🎉</p><div class="row"><button class="btn go" id="more">Jugar otra vez</button><button class="btn" id="bk">Volver</button></div>`;$('#more').onclick=findGame;$('#bk').onclick=()=>show(1,false);return}
      round++;const t=1+Math.random()*max|0;
      const flip=t>=10&&t%10?+(String(t)[1]+String(t)[0]):0;
      const pool=shuffle([flip,t+1,t-1,t+10,t-10,1+Math.random()*max|0].filter(x=>x>=1&&x<=100&&x!==t));
      const opts=shuffle([t,...[...new Set(pool)].slice(0,3)]);let tries=0;
      nc.innerHTML=`<p class="qtitle">¿Dónde está el ${nw(t)}? <button class="btn" id="rep" style="min-height:44px" aria-label="Escuchar otra vez">🔊</button></p><div class="opts">${opts.map(numOpt).join('')}</div><p class="hint">Ronda ${round} de 5</p>`;
      lula(`¿Dónde está el ${nw(t)}?`);$('#rep').onclick=()=>lula(`¿Dónde está el ${nw(t)}?`);
      $$('.opt',nc).forEach(b=>b.onclick=()=>{
        if(+b.dataset.n===t){b.classList.add('good');if(!tries)hits++;win(1,`¡Sí! Ese es el ${nw(t)}.`).then(()=>wait(400)).then(next)}
        else{tries++;oops(b,`Ese es el ${nw(+b.dataset.n)}. Buscá el ${nw(t)}.`)}
      });
    };
    next();
  }
  show(1,false);
  lula('Tocá un número para escuchar cómo se llama. Los de color naranja son las decenas: diez, veinte, treinta…');
  cleanup=()=>{counting=false};
}

/* 3 y 4. Sumas y restas */
const NOBJ=[['🍎','manzana','manzanas',1,'nos comimos|nos comimos'],['🎈','globo','globos',0,'se voló|se volaron'],['🐟','pez','peces',0,'se fue nadando|se fueron nadando'],['⭐','estrella','estrellas',1,'se apagó|se apagaron'],
 ['🍓','frutilla','frutillas',1,'nos comimos|nos comimos'],['🐞','vaquita','vaquitas',1,'se fue volando|se fueron volando'],['🐥','pollito','pollitos',0,'se escapó|se escaparon'],['🌸','flor','flores',1,'cortamos|cortamos'],
 ['🐦','pajarito','pajaritos',0,'se voló|se volaron'],['🍪','galletita','galletitas',1,'nos comimos|nos comimos']].map(([e,one,many,fem,gone])=>({e,one,many,fem,gone:gone.split('|')}));
const nObj=(n,o)=>`${nw(n,o.fem)} ${n===1?o.one:o.many}`;
const cap=t=>t[0].toUpperCase()+t.slice(1);
function mathGame(st,id){
  const plus=id==='sumar';
  function round(){
    const lv=numLevel(id,5,12,20),tens=lv>=3&&Math.random()<.4;const max=[5,10,20,20][lv];
    let a,b;
    if(plus){if(tens){a=1+Math.random()*8|0;b=1+Math.random()*(9-a)|0;a*=10;b*=10}else{a=1+Math.random()*(max-1)|0;b=1+Math.random()*(max-a)|0}}
    else{if(tens){a=2+Math.random()*8|0;b=1+Math.random()*(a-1)|0;a*=10;b*=10}else{a=2+Math.random()*(max-1)|0;b=1+Math.random()*(a-1)|0}}
    const ans=plus?a+b:a-b,o=pick(NOBJ),sg=plus?'+':'−';
    const vis=tens?(plus?`<div class="grp tb">${bars(a/10)}</div><b class="sign">+</b><div class="grp tb">${bars(b/10)}</div>`:`<div class="grp tb" id="g1">${bars(a/10)}</div>`)
      :(plus?`<div class="grp">${objs(a,o.e)}</div><b class="sign">+</b><div class="grp">${objs(b,o.e)}</div>`:`<div class="grp" id="g1">${objs(a,o.e)}</div>`);
    const story=tens?(plus?`${nw(a)} más ${nw(b)}. ¿Cuánto es?`:`Tenemos ${nw(a)}. Sacamos ${nw(b)}. ¿Cuánto queda?`)
      :plus?`Hay ${nObj(a,o)} y ${b===1?'llega':'llegan'} ${nw(b,o.fem)} más. ¿Cuánt${o.fem?'as':'os'} hay en total?`
      :`Había ${nObj(a,o)}. ${cap(o.gone[b===1?0:1])} ${nw(b,o.fem)}. ¿Cuánt${o.fem?'as':'os'} quedan?`;
    st.innerHTML=`<div class="panel center"><div class="eq" id="eq">${vis}</div>
      <div class="eqn" id="eqn">${a} ${sg} ${b} = <span class="q">?</span></div>
      <div class="opts">${numOpts(ans,tens?10:1).map(numOpt).join('')}</div>
      <div class="row"><button class="btn sun" id="hear">🔊 Escuchar</button><button class="btn" id="cnt">👆 Contemos juntas</button></div></div>`;
    const eq=$('#eq');countable(eq);
    const tell=()=>lula(story);
    if(plus)tell();
    else{lula(story.split('. ')[0]+'.').then(()=>wait(200)).then(()=>{const g=$$('.ob',$('#g1')||eq);g.slice(-b).forEach((x,i)=>setTimeout(()=>{x.classList.remove('counted');x.classList.add('gone');sfx.boing()},i*180));return wait(b*180+300)}).then(()=>{if(eq.isConnected)lula(story.split('. ').slice(1).join('. '))})}
    $('#hear').onclick=tell;$('#cnt').onclick=()=>countAll(eq);
    let miss=0;
    $$('.opt',st).forEach(bt=>bt.onclick=async()=>{
      if(+bt.dataset.n===ans){
        bt.classList.add('good');$('#eqn').innerHTML=`${a} ${sg} ${b} = <span class="q">${ans}</span>`;bump(id);
        await win(miss?1:2,`¡Sí! ${nw(a)} ${plus?'más':'menos'} ${nw(b)} es igual a ${nw(ans)}.`);
        st.querySelector('.panel').insertAdjacentHTML('beforeend',`<div class="row"><button class="btn go" id="nx">Otra ▶</button></div>`);$('#nx').onclick=round;
      }else{miss++;oops(bt,miss>=2?`Ese es el ${nw(+bt.dataset.n)}. Tocá "Contemos juntas" y te ayudo.`:`Ese es el ${nw(+bt.dataset.n)}. Probá de nuevo: podés tocar los dibujos para contarlos.`)}
    });
  }
  round();
}
function actSumar(st){mathGame(st,'sumar')}
function actRestar(st){mathGame(st,'restar')}

/* Explorar + jugar: tarjeta arriba, preguntas con "Otra ▶" */
function quiz(st,id,box,make){
  function round(){
    const q=make();let miss=0;
    box.innerHTML=`<p class="qtitle">${q.ask}</p>${q.html||''}<div class="opts">${q.opts.map(o=>o.btn).join('')}</div>`;
    lula(q.say||q.ask);
    $$('.opt',box).forEach(b=>b.onclick=async()=>{

      else{miss++;oops(b,q.no(o))}
    });
  }
  round();
}

/* 2. La hora */
function horaTxt(h,m){const H=h===1?'Es la una':`Son las ${nw(h)}`;return H+(m===0?' en punto':m===30?' y media':' y cuarto')}
const horaDig=(h,m)=>`${h}:${String(m).padStart(2,'0')}`;
function clockSvg(h,m){
  const ha=((h%12)+m/60)*30,ma=m*6,nums=Array.from({length:12},(_,i)=>{const n=i+1,a=n*Math.PI/6;return `<text x="${100+72*Math.sin(a)}" y="${100-72*Math.cos(a)+8}" text-anchor="middle" font-size="22" font-family="Andika,sans-serif" font-weight="700" fill="#17304D">${n}</text>`}).join('');
  const ticks=Array.from({length:60},(_,i)=>`<line x1="100" y1="8" x2="100" y2="${i%5?13:17}" stroke="#9FB4CC" stroke-width="${i%5?1.5:3}" transform="rotate(${i*6} 100 100)"/>`).join('');
  return `<svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="96" fill="#fff" stroke="#FFB21E" stroke-width="7"/>${ticks}${nums}
   <line x1="100" y1="100" x2="100" y2="48" stroke="#E5405E" stroke-width="9" stroke-linecap="round" transform="rotate(${ha} 100 100)"/>
   <line x1="100" y1="100" x2="100" y2="24" stroke="#2563EB" stroke-width="6" stroke-linecap="round" transform="rotate(${ma} 100 100)"/>
   <circle cx="100" cy="100" r="8" fill="#17304D"/></svg>`;
}
function actHora(st){

  function explore(speak=true){

      yes:`¡Sí! ${horaTxt(...t)}.`,no:o=>`Esa es ${horaTxt(...o.o).replace(/^(Son|Es) /,'')}. Mirá la aguja corta: marca la hora.`};

    singing=true;btn.textContent='⏹ Parar';hush();

  }

    if(r<.12)return {ask:'¿Cuántos días tiene la semana?',opts:shuffle([5,7,10]).map(n=>({k:''+n,ok:n===7,n,btn:numOpt(n).replace('data-n','data-k')})),yes:'¡Sí! La semana tiene siete días, de lunes a domingo.',no:o=>`No son ${nw(o.n)}. Contemos: lunes, martes, miércoles, jueves, viernes, sábado y domingo.`};
    const months=lv&&r<.55,L=months?MESES.map(m=>m[0]):DIAS,n=L.length,i=Math.random()*n|0,before=lv&&Math.random()<.4;
    const ans=L[before?(i+n-1)%n:(i+1)%n],opts=shuffle([ans,...shuffle(L.filter(x=>x!==ans&&x!==L[i])).slice(0,2)]);
    const ask=`¿Qué ${months?'mes':'día'} viene ${before?'antes':'después'} ${L[i].match(/^[aeiou]/)?'de':'del'} ${L[i]}?`.replace(/de(l)? (\w)/,(s,l,c)=>`del ${c}`);
    return {ask,opts:opts.map(w=>({k:w,ok:w===ans,w,btn:wBtn(w)})),yes:`¡Sí! ${before?`Antes del ${L[i]} viene el ${ans}`:`Después del ${L[i]} viene el ${ans}`}.`,no:o=>`No es ${o.w}. Cantalos en orden y fijate.`};
  });

}

  function play(i,lvi){
    const [cols,rows]=LV[lvi],img=pzImg(i),bw=Math.min(st.getBoundingClientRect().width,560),bh=Math.round(bw*.75),pw=bw/cols,ph=bh/rows;
    const bs=`${bw}px ${bh}px`,pos=k=>`${-(k%cols)*pw}px ${-Math.floor(k/cols)*ph}px`;
    st.innerHTML=`<div class="chips" style="justify-content:center">${LV.map(([c,r],j)=>`<button class="chip name ${j===lvi?'on':''}" data-l="${j}" data-say="${c*r} piezas">${c*r} piezas</button>`).join('')}</div>
      <div class="pzboard" id="bd" style="width:${bw}px;height:${bh}px;grid-template-columns:repeat(${cols},1fr);--img:url(${img});--bs:${bs}">${Array.from({length:cols*rows},(_,k)=>`<div class="pzslot" data-k="${k}" style="--bp:${pos(k)}"></div>`).join('')}</div>
      <div class="pztray" id="tr">${shuffle([...Array(cols*rows).keys()]).map(k=>`<div class="pzp" data-k="${k}" style="width:${pw*.86}px;height:${ph*.86}px;background-image:url(${img});background-size:${bw*.86}px ${bh*.86}px;background-position:${-(k%cols)*pw*.86}px ${-Math.floor(k/cols)*ph*.86}px"></div>`).join('')}</div>
      <div class="row"><button class="btn" id="bk">🖼️ Otro dibujo</button></div>`;
    $$('.chip',st).forEach(b=>b.onclick=()=>play(i,+b.dataset.l));$('#bk').onclick=list;
    lula(`${PZS[i].n}. Arrastrá cada pieza a su lugar. ¡Mirá los colores del dibujito de fondo!`);
    const bd=$('#bd'),tr=$('#tr');let sel=null,placed=0;
    function place(p,slot){
      p.classList.remove('sel','drag');p.style.left=p.style.top='';slot.appendChild(p);p.style.backgroundSize=bs;p.style.backgroundPosition=pos(+p.dataset.k);
      sel=null;placed++;sfx.pop();
      if(placed===cols*rows){bd.classList.add('done');S.pz[i]=Math.max(S.pz[i]||0,cols*rows);save();bump('rompe');
        win(cols*rows>=9?3:2,`¡Lo armaste! ${PZS[i].n}. ${lvi<3?'¿Probamos con más piezas?':'¡Sos una experta en rompecabezas!'}`).then(()=>{
          if(!$('#bd'))return;tr.innerHTML=lvi<3?`<button class="btn go" id="up">🧩 ¡Con ${LV[lvi+1][0]*LV[lvi+1][1]} piezas!</button>`:'';const up=$('#up');if(up)up.onclick=()=>play(i,lvi+1)})}
    }
    function tryDrop(p,slot){
      if(slot&&!slot.firstChild&&slot.dataset.k===p.dataset.k){place(p,slot);return true}
      if(slot){oops(null,'Esa pieza no va ahí. Mirá bien los colores.');slot.classList.add('hl');setTimeout(()=>slot.classList.remove('hl'),400)}
      return false;
    }
    // Arrastrar con el dedo, o tocar la pieza y después el lugar
    tr.addEventListener('pointerdown',e=>{
      const p=e.target.closest('.pzp');if(!p||!tr.contains(p))return;e.preventDefault();
      const r=p.getBoundingClientRect(),ox=e.clientX-r.left,oy=e.clientY-r.top,sx=e.clientX,sy=e.clientY;let moved=false;
      const mv=ev=>{if(!moved&&Math.hypot(ev.clientX-sx,ev.clientY-sy)<8)return;
        if(!moved){moved=true;p.classList.add('drag');p.style.width=pw+'px';p.style.height=ph+'px';p.style.backgroundSize=bs;p.style.backgroundPosition=pos(+p.dataset.k)}
        p.style.left=ev.clientX-ox*(pw/r.width)+'px';p.style.top=ev.clientY-oy*(ph/r.height)+'px'};
      const up=ev=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);
        if(!moved){if(sel)sel.classList.remove('sel');sel=sel===p?null:p;if(sel){p.classList.add('sel');sfx.tap()}return}
        const slot=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('.pzslot');
        if(!tryDrop(p,slot)){p.classList.remove('drag');p.style.left=p.style.top='';p.style.width=pw*.86+'px';p.style.height=ph*.86+'px';p.style.backgroundSize=`${bw*.86}px ${bh*.86}px`;p.style.backgroundPosition=`${-(+p.dataset.k%cols)*pw*.86}px ${-Math.floor(+p.dataset.k/cols)*ph*.86}px`}};
      addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',up);
    });
    bd.onclick=e=>{const slot=e.target.closest('.pzslot');if(!slot||!sel)return;tryDrop(sel,slot)};
  }
  list();
}

/* ---------- Rincón de papás ---------- */
function showParents(){
  const vs=('speechSynthesis' in window)?speechSynthesis.getVoices().filter(v=>/^es/i.test(v.lang)):[];
  const acts=Object.entries(ACTS).map(([k,a])=>`<span>${a.e} ${a.t}</span><b>${S.done[k]||0}</b>`).join('');
  const m=modal(`<h2>👪 Rincón de papás</h2>
   <div class="kv"><span>⭐ Estrellas</span><b>${S.stars}</b><span>🎁 Figuritas</span><b>${S.stickers.length} / ${STK.length}</b><span>🔤 Letras exploradas</span><b>${Object.keys(S.seen).length} / 27</b><span>✏️ Letras trazadas</span><b>${Object.keys(S.traced).length} / 27</b><span>❓ Porqués escuchados</span><b>${Object.keys(S.whys).length} / ${WHY.length}</b></div>
   <div class="minigrid">${ABC.map(a=>`<span class="${S.traced[a.L]?'t':S.seen[a.L]?'s':''}">${a.L}</span>`).join('')}</div>
   <p class="tips">Azul: la escuchó · Verde: la trazó bien.</p>
   <details><summary class="tips">Actividades completadas</summary><div class="kv" style="margin-top:6px">${acts}</div></details>
   <label class="field">Letras en pantalla<select id="pcase"><option value="1" ${S.upper?'selected':''}>IMPRENTA MAYÚSCULA (como en el jardín)</option><option value="0" ${!S.upper?'selected':''}>minúscula</option></select></label>
   <label class="field">📊 Planilla "Avances de Luciana" (link de conexión)<input id="pdb" type="url" inputmode="url" placeholder="https://script.google.com/macros/s/…/exec" value="${dbUrl}"></label>
   <div class="row" style="margin-top:6px"><button class="btn" id="pdbt">🔌 Conectar y guardar</button></div>
   <p class="tips center" id="pdbs">${dbUrl?`Conectada · ${queue.length} resultados por enviar`:'Sin conectar: los avances quedan solo en este celular.'}</p>
   <label class="field">Voz de Lula<select id="pvoice"><option value="">Automática</option>${vs.map(v=>`<option value="${v.voiceURI}" ${v.voiceURI===S.voice?'selected':''}>${v.name} (${v.lang})</option>`).join('')}</select></label>
   <label class="field">Velocidad de la voz<input type="range" id="prate" min="0.6" max="1.1" step="0.05" value="${S.rate}"></label>
   <p class="tips" style="margin-top:14px"><b>Ideas:</b> 10 a 15 minutos por día alcanzan. Leé con ella los "¿Por qué?" y hagan juntas el experimento de "Probalo en casa". En Trazar, el botón "Mi nombre" practica L-U-C-I-A-N-A letra por letra.</p>
   <div class="row"><button class="btn" id="preset">🗑️ Borrar progreso</button><button class="btn go" data-close>Listo</button></div><div id="pconf"></div>`);
  $('#pdbt',m).onclick=async()=>{
    const st=$('#pdbs',m),u=$('#pdb',m).value.trim();
    if(!u){dbUrl='';try{localStorage.removeItem(DBK)}catch(e){}st.textContent='Desconectada: los avances quedan solo en este celular.';return}
    if(!okDbUrl(u)){st.textContent='❌ Ese link no es el de la planilla. Tiene que empezar con https://script.google.com/macros/s/ y terminar en /exec';return}
    st.textContent='⏳ Conectando…';
    try{
      const j=await pullDb(u);dbUrl=u;try{localStorage.setItem(DBK,u)}catch(e){}
      const remote=j.datos&&(j.datos.stars||0)>S.stars;
      st.innerHTML=`✅ Conectada.${j.guardado?` Último guardado: ${j.guardado}.`:''} <a href="${j.url}" target="_blank" rel="noopener">Abrir planilla</a>`+(remote?`<br><button class="btn sun" id="prec" style="margin-top:8px">⬇️ Recuperar avances de la planilla (⭐ ${j.datos.stars})</button>`:'');
      if(remote)$('#prec',m).onclick=()=>{adopt(j.datos);m.remove();go('home');lula('¡Recuperé tus avances de la planilla!')};
      else if(!(await pushDb()))st.insertAdjacentText('beforeend',' (no se pudo guardar ahora; se reintenta solo)');
    }catch(e){st.textContent='❌ No se pudo conectar. Revisá el link y que la aplicación web esté publicada para "Cualquier usuario".'}
  };
  $('#pcase',m).onchange=e=>{S.upper=e.target.value==='1';save()};
  $('#pvoice',m).onchange=e=>{S.voice=e.target.value;save();pickVoice();say('Hola Luciana, soy Lula.')};
  $('#prate',m).onchange=e=>{S.rate=+e.target.value;save();say('Así hablo ahora.')};
  $('#preset',m).onclick=()=>{$('#pconf',m).innerHTML=`<p class="tips center">¿Seguro? Se borran estrellas, figuritas y avances.</p><div class="row"><button class="btn" id="pyes" style="border-color:var(--vow);color:var(--vow)">Sí, borrar todo</button></div>`;$('#pyes',m).onclick=()=>{const keep={upper:S.upper,rate:S.rate,voice:S.voice};S=Object.assign({},DEF,{stickers:[],seen:{},traced:{},done:{},whys:{},grav:{},mixes:{},zones:{},mags:{},flots:{},pz:{}},keep);save();updateBadges();m.remove();go('home')}};
  m.addEventListener('click',e=>{if(e.target===m||e.target.closest('[data-close]'))go('home')});
}

/* ---------- arranque ---------- */
updateBadges();
go('home');
$('#startBtn').onclick=()=>{ac();sfx.fanfare();pickVoice();$('#start').remove();greeted=false;go('home');
  // Si en la planilla hay más avances (por ejemplo, de otro celular), los recupera
  if(dbUrl)pullDb().then(j=>{if(j.datos&&(j.datos.stars||0)>S.stars){adopt(j.datos);go('home');lula('¡Recuperé tus avances de la planilla!')}else pushDb()}).catch(()=>{})};
</script>
